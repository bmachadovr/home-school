<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Teste dos chats do 4º bimestre</title></head><body><pre id="status">EM_EXECUCAO</pre><iframe id="screen" style="width:500px;height:650px;opacity:.05" title="Teste"></iframe><script>
(async()=>{
 const status=document.querySelector('#status'),frame=document.querySelector('#screen');
 const check=(ok,msg)=>{if(!ok)throw Error(msg);};
 const sleep=t=>new Promise(resolve=>setTimeout(resolve,t));
 function open(url){return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(Error('Tempo excedido: '+url)),8000);
  frame.onload=()=>{clearTimeout(timer);resolve(frame.contentWindow)};
  // Apenas nos testes locais: 45 ms por digitação para validar 240 seleções.
  const fast=!url.includes('realDelay=1')&&/^(portugues|matematica)\//.test(url);
  frame.src=url+(url.includes('?')?'&':'?')+(fast?'chatTestFast=1&':'')+'check='+Math.random();
 });}
 const element=(win,query)=>{const e=win.document.querySelector(query);check(!!e,'Elemento ausente '+query);return e;};
 async function until(predicate,message,timeout=4000){
  const start=performance.now();
  while(performance.now()-start<timeout){if(predicate())return;await sleep(15);}
  throw Error('Timeout: '+message);
 }
 const slot=i=>(i*7+Math.floor(i/4))%4;
 const part=i=>(slot(i)+1+(i%2))%4;
 const wrong=i=>[0,1,2,3].filter(n=>n!==slot(i)&&n!==part(i));
 async function begin(subject,student,slow=false){
  localStorage.removeItem('hs-chat-4b-'+subject+'-v1');
  const w=await open(subject+'/index.html'+(slow?'?realDelay=1':''));
  check(w.document.querySelectorAll('#studentName').length===1,'O nome deve ser o único campo');
  element(w,'#studentName').value=student;
  element(w,'#nameForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  check(element(w,'.contact').textContent.includes(student),'Nome no cabeçalho ausente');
  check(element(w,'#chatScroll').textContent.includes(student),'Nome não aparece na conversa');
  check(w.document.querySelectorAll('.response-option').length===4,'Precisam existir quatro respostas');
  return w;
 }
 function send(w,choice,i){
  const options=[...w.document.querySelectorAll('.response-option')];
  check(options.length===4,'Faltam as quatro escolhas na pergunta '+(i+1));
  check(options.every(x=>x.textContent.length>15),'Resposta não está em linguagem natural');
  options[choice].click();
  check(!!w.document.querySelector('.just-sent'),'A mensagem enviada não foi destacada');
  check(!!w.document.querySelector('.typing-bubble'),'Professor não está digitando');
  check(!!w.document.querySelector('.reply-waiting'),'Confirmação da resposta não apareceu');
  check(element(w,'.reply-waiting').textContent.includes('Resposta enviada!'),'Confirmação não está clara');
  check(!w.document.querySelector('.response-option'),'Novas opções apareceram antes da digitação terminar');
  check(!w.document.querySelector('.feedback'),'Não deve haver correção individual');
  check(element(w,'.progress-wrap').textContent.includes((i+1)+' de 80'),'Progresso não foi salvo após selecionar');
 }
 async function afterTyping(w,i){
  await until(()=>i===79?!!w.document.querySelector('.result'):w.document.querySelectorAll('.response-option').length===4,'Próxima pergunta '+(i+2));
  if(i<79){
   check(!!w.document.querySelector('.reply-fresh'),'Nova resposta não recebeu destaque');
   check(element(w,'.reply-label').textContent.includes((i+2)+'/80'),'Número da nova pergunta não aparece');
  }
 }
 async function run80(subject,student,kind){
  let w=await begin(subject,student);
  const expected=kind==='full'?100:97;
  for(let i=0;i<80;i++){
   const choice=kind==='full'?slot(i):(i===0?part(i):i===1?wrong(i)[0]:i===2?wrong(i)[1]:slot(i));
   send(w,choice,i);
   if(i===9){
    w=await open(subject+'/index.html');
    check(element(w,'.progress-wrap').textContent.includes('10 de 80'),'Retomada de progresso falhou');
    check(!w.document.querySelector('#nameForm'),'Não deve pedir nome novamente');
    check(!!w.document.querySelector('.reply-waiting')||w.document.querySelectorAll('.response-option').length===4,'Retomada interrompeu o turno');
   }
   await afterTyping(w,i);
  }
  check(element(w,'.score strong').textContent===expected.toFixed(2).replace('.',','),'Pontuação incorreta '+subject+' '+kind);
  const stored=JSON.parse(localStorage.getItem('hs-chat-4b-'+subject+'-v1'));
  check(stored.answers.length===80,'Respostas não foram persistidas');
  check(!w.document.querySelector('.response-option'),'Opções não devem aparecer após conclusão');
  return {subject,kind,score:expected,answers:80};
 }
 const report=[];
 report.push(await run80('portugues','Lia','full'));
 report.push(await run80('matematica','Bia','full'));
 report.push(await run80('portugues','Júlia','partial'));
 // Teste do tempo real de digitação em uma pergunta sem aceleração de QA.
 const slow=await begin('matematica','Ana',true);
 const start=performance.now();
 send(slow,slot(0),0);
 await sleep(520);
 check(!!slow.document.querySelector('.typing-bubble'),'Indicador sumiu cedo demais');
 check(!slow.document.querySelector('.response-option'),'Alternativas apareceram antes de 1 segundo');
 await afterTyping(slow,0);
 const elapsed=performance.now()-start;
 check(elapsed>=1200&&elapsed<2700,'Tempo real fora da faixa esperada: '+elapsed);
 report.push({pacing:'real',typingMs:Math.round(elapsed)});
 const home=await open('../../index.html');
 for(const subject of ['portugues','matematica'])
  check(!!home.document.querySelector('a[href="atividades/chat-4b/'+subject+'/index.html"]'),'Link na Home ausente: '+subject);
 status.textContent='SMOKE_SUCCESS\n'+report.map(x=>JSON.stringify(x)).join('\n');
})().catch(e=>document.querySelector('#status').textContent='SMOKE_FAILURE: '+e.stack);
</script></body></html>
