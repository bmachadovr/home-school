ound"/><text x="130" y="255" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#166534">Cultura</text><text x="130" y="302" text-anchor="middle" font-family="Arial" font-size="24" fill="#4b5563">preservar saberes</text></g><rect x="180" y="565" width="840" height="78" rx="24" fill="#fffdf8" stroke="#fdba74" stroke-width="3"/><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#7c2d12">Resistir também era agir para preservar liberdade, vínculos e cultura.</text></svg>