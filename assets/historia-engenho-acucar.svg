<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Da cana ao açúcar</title><desc id="d">Sequência visual do plantio da cana, moenda, preparo e exportação do açúcar no Brasil Colonial.</desc><rect width="1200" height="700" rx="36" fill="#f7fee7"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="72" text-anchor="middle" font-size="44" font-weight="700" fill="#365314">Da cana ao açúcar</text></g><g transform="translate(90 150)"><circle cx="110" cy="120" r="98" fill="#d9f99d"/><path d="M110 174V82m0 34c-35-40-69-41-84-21 32 2 58 15 84 45m0-21c36-43 70-42 86-19-34 1-61 15-86 46" fill="none" stroke="#3f6212" stroke-width="13" stroke-linecap="round"/><text x="110" y="270" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#365314">1. Plantio</text></g><g transform="translate(375 150)"><circle cx="110" cy="120" r="98" fill="#fed7aa"/><circle cx="110" cy="120" r="48" fill="none" stroke="#9a3412" stroke-width="15"/><g stroke="#9a3412" stroke-width="14" stroke-linecap="round"><path d="M110 44v28M110 168v28M34 120h28M158 120h28M56 66l20 20M144 154l20 20M164 66l-20 20M76 154l-20 20"/></g><text x="110" y="270" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#7c2d12">2. Moenda</text></g><g transform="translate(660 150)"><circle cx="110" cy="120" r="98" fill="#fde68a"/><path d="M60 150h100l-16 42H76z" fill="#92400e"/><path d="M72 138c8-40 70-40 78 0" fill="none" stroke="#78350f" stroke-width="10"/><path d="M83 81c-20-27 11-42 0-65m31 65c-20-27 11-42 0-65m31 65c-20-27 11-42 0-65" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round"/><text x="110" y="270" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#92400e">3. Preparo</text></g><g transform="translate(945 150)"><circle cx="110" cy="120" r="98" fill="#bfdbfe"/><path d="M50 157h116l-21 35H70z" fill="#1d4ed8"/><rect x="104" y="51" width="9" height="102" r