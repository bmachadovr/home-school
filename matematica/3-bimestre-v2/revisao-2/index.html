<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matemática • Revisão 2 • Academia de Detetives</title>
<style>
:root{--ink:#20243b;--p:#6847d9;--gold:#e7a92e;--ok:#117a59;--bad:#b63850;--paper:#fffaf0;--line:#ddd8ef;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#15172a;color:var(--ink)}button,input{font:inherit}.app{max-width:1120px;margin:auto;min-height:100vh;background:linear-gradient(150deg,#f5eddd,#eeeaff);padding:16px}.hud{position:sticky;top:7px;z-index:9;display:flex;align-items:center;gap:10px;background:#fffffff2;border:1px solid #ded8ed;border-radius:17px;padding:10px 13px;box-shadow:0 8px 28px #0002}.hud b{margin-right:auto}.bar{width:180px;height:9px;border-radius:9px;background:#ddd;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}.scene{margin-top:14px;min-height:78vh;background:#fff;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 22px 60px #0003}.art{min-height:530px;background:linear-gradient(150deg,#1f1d3e,#6847d9);color:white;padding:28px;display:grid;place-items:center}.visual{width:90%;max-width:470px;min-height:350px;border-radius:26px;background:#17182d;border:1px solid #ffffff22;box-shadow:0 20px 50px #0005;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}.visual .big{font:900 clamp(2rem,5vw,4rem)/1 Georgia,serif;color:#ffd36a}.visual .formula{font-size:1.5rem;font-weight:900;background:#ffffff14;padding:15px 18px;border-radius:15px}.balance{width:260px;height:150px;position:relative}.balance:before{content:"";position:absolute;width:220px;height:7px;background:#f4c45a;left:20px;top:45px;transform:rotate(-4deg)}.balance:after{content:"";position:absolute;width:8px;height:95px;background:#ddd;left:126px;top:45px}.pan{position:absolute;top:65px;width:88px;border-bottom:5px solid white;text-align:center;padding-bottom:10px;font-weight:900}.pan.l{left:5px}.pan.r{right:5px}.circle{width:230px;height:230px;border:8px solid #f4c45a;border-radius:50%;position:relative}.circle:before{content:"";position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;left:calc(50% - 4px);top:calc(50% - 4px)}.circle .dia{position:absolute;left:0;top:calc(50% - 2px);width:100%;height:4px;background:#fff}.circle .rad{position:absolute;left:50%;top:calc(50% - 2px);width:50%;height:4px;background:#65d8ff;transform:rotate(-35deg);transform-origin:left}.gridshape{display:grid;grid-template-columns:repeat(6,42px);grid-template-rows:repeat(5,42px);gap:3px}.sq{background:#f3c95f;border-radius:5px}.sq.off{visibility:hidden}.poly{width:260px;height:190px;background:#f3c95f;clip-path:polygon(12% 85%,32% 15%,88% 15%,68% 85%);position:relative}.tri{width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:190px solid #f3c95f}.panel{padding:36px;display:flex;flex-direction:column;justify-content:center}.kicker{font-size:.76rem;letter-spacing:.12em;font-weight:950;color:var(--p)}h1,h2{font-family:Georgia,serif;margin:.35rem 0 1rem}h1{font-size:clamp(2.4rem,5vw,4.2rem)}h2{font-size:2.15rem}.panel p{line-height:1.65}.note{background:var(--paper);border:1px solid #ead7a7;border-radius:15px;padding:14px;margin:10px 0}.math{font-size:1.28rem;font-weight:900;text-align:center;background:#f4f1ff;border-radius:14px;padding:14px}.choices{display:grid;gap:9px;margin:14px 0}.choices button,.next,.back{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;text-align:left;font-weight:850;cursor:pointer}.choices button:hover,.next:hover,.back:hover{transform:translateY(-1px);box-shadow:0 6px 18px #0001}.choices button.correct{border:2px solid var(--ok);background:#ecfbf5}.choices button.wrong{border:2px solid var(--bad);background:#fff1f3}.feedback{min-height:50px;font-weight:800;line-height:1.45}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.next{background:var(--p);color:#fff;text-align:center;border:0}.next:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}.nav{display:flex;gap:9px;margin-top:12px}.back{flex:0 0 auto}.next{flex:1}.inputrow{display:flex;gap:8px;margin:14px 0}.inputrow input{flex:1;border:2px solid var(--line);border-radius:13px;padding:13px}.inputrow button{border:0;border-radius:13px;padding:13px 16px;background:#292a48;color:white;font-weight:900}.pillrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pill{padding:10px 13px;border-radius:999px;background:#ffffff17;border:1px solid #ffffff2b;font-weight:900}.report{display:grid;gap:10px}.report div{padding:13px;border-radius:13px;background:#f6f3ff;border-left:5px solid var(--gold)}.report div.good{border-left-color:var(--ok)}@media(max-width:760px){.scene{grid-template-columns:1fr}.art{min-height:280px}.visual{min-height:240px}.panel{padding:23px}.hud{font-size:.8rem}.bar{width:85px}}
</style></head><body><main class="app"><div class="hud"><b>📐 Matemática • Revisão 2</b><span id="score">0/0</span><div class="bar"><i id="bar"></i></div><span id="step"></span></div><div id="root"></div></main>
<script>
const screens=[
{t:'cover',k:'REVISÃO 2 • 7º ANO',h:'Academia de Detetives Matemáticos',p:'Agora que o caso do cofre foi resolvido, Jujuba entra no treinamento de perícia matemática. Aqui o objetivo é dominar exatamente as ferramentas que aparecem no material da prova.',note:'Cap. 11: inequações. Cap. 12: circunferência, áreas e decomposição. Os desafios ficam mais difíceis aos poucos.'},
{t:'info',k:'MISSÃO 1 • INEQUAÇÕES',h:'Leia o sinal antes de calcular',p:'Uma inequação compara dois membros. > significa maior, < menor, ≥ maior ou igual e ≤ menor ou igual.',v:'x + 3 > 5',note:'O que está à esquerda do sinal é o 1º membro. O que está à direita é o 2º membro.'},
{q:'Qual frase representa x + 4 ≤ 11?',a:['x mais 4 é menor ou igual a 11','x mais 4 é maior que 11','x menos 4 é igual a 11','4x é menor que 11'],c:0,e:'≤ significa “menor ou igual”.',k:'TRADUZINDO SITUAÇÕES',v:'x + 4 ≤ 11'},
{q:'“O dobro de um número é menor que 30.” Qual inequação representa a frase?',a:['x + 2 < 30','2x < 30','2x > 30','x/2 < 30'],c:1,e:'Dobro de x é 2x; “menor que” usa <.',k:'TRADUZINDO SITUAÇÕES',v:'2x < 30'},
{q:'Na inequação 5 − 2x ≤ x + 23, qual é o 2º membro?',a:['5 − 2x','x + 23','≤','23'],c:1,e:'O 2º membro fica à direita do sinal de desigualdade.',k:'1º E 2º MEMBROS',v:'5 − 2x ≤ x + 23'},
{t:'info',k:'PRINCÍPIO DE EQUIVALÊNCIA',h:'Somar ou subtrair: o sinal fica quieto',p:'Ao adicionar o mesmo número aos dois membros, ou subtrair o mesmo número de ambos, obtemos uma desigualdade equivalente e o sentido é mantido.',v:'y + 7 ≥ 15  →  y ≥ 8',note:'A mesma ideia usada para isolar a incógnita nas equações continua funcionando.'},
{q:'Resolva: x + 12 ≤ 17.',a:['x ≤ 5','x ≥ 5','x < 29','x ≥ 29'],c:0,e:'Subtraindo 12 dos dois membros: x ≤ 5.',k:'RESOLVENDO',v:'x + 12 ≤ 17'},
{q:'Resolva: y − 6 > 10.',a:['y > 4','y < 16','y > 16','y ≥ 16'],c:2,e:'Somamos 6 aos dois membros: y > 16.',k:'RESOLVENDO',v:'y − 6 > 10'},
{t:'info',k:'REGRA-CHAVE',h:'Número negativo vira a placa',p:'Ao multiplicar ou dividir os dois membros por um número negativo, o sentido da desigualdade é invertido.',v:'−3x > −21  →  x < 7',note:'No material, essa regra recebe destaque. É uma das mais importantes desta revisão.'},
{q:'Resolva: −2x ≤ 16.',a:['x ≤ −8','x ≥ −8','x ≥ 8','x < −8'],c:1,e:'Dividimos por −2 e invertemos ≤ para ≥: x ≥ −8.',k:'SINAL INVERTIDO',v:'−2x ≤ 16'},
{q:'Se −5x > 20, então:',a:['x > −4','x < 4','x < −4','x ≥ −4'],c:2,e:'Dividir por −5 inverte > para <: x < −4.',k:'SINAL INVERTIDO',v:'−5x > 20'},
{q:'Qual operação exige inverter o sinal da desigualdade?',a:['Somar 8 aos dois membros','Dividir os dois membros por 3','Subtrair 2 dos dois membros','Multiplicar os dois membros por −4'],c:3,e:'A inversão ocorre ao multiplicar ou dividir por número negativo.',k:'REGRA DE OURO',v:'positivo: mantém • negativo: inverte'},
{t:'info',k:'INEQUAÇÃO NOS DOIS MEMBROS',h:'A incógnita pode aparecer dos dois lados',p:'O livro resolve inequações reunindo os termos com incógnita em um membro e os números no outro.',v:'9 + 7x > 2x + 24  →  5x > 15  →  x > 3'},
{q:'Resolva: 9 + 7x > 2x + 24.',a:['x < 3','x > 3','x ≥ 3','x > 15'],c:1,e:'7x−2x > 24−9, então 5x > 15 e x > 3.',k:'DOIS MEMBROS',v:'9 + 7x > 2x + 24'},
{q:'Resolva: 6x − 5 ≤ 8x + 11.',a:['x ≤ −8','x ≥ 8','x ≥ −8','x ≤ 8'],c:2,e:'Somando 5: 6x ≤ 8x+16. Subtraindo 8x: −2x ≤16. Dividindo por −2, inverte: x ≥−8.',k:'DOIS MEMBROS',v:'6x − 5 ≤ 8x + 11'},
{q:'Resolva: 2x + 13 > 5x − 8.',a:['x < 7','x > 7','x ≤ 7','x < −7'],c:0,e:'2x−5x > −8−13 → −3x > −21. Dividindo por −3, inverte: x < 7.',k:'DOIS MEMBROS',v:'2x + 13 > 5x − 8'},
{q:'Se x é natural e x + 12 ≤ 17, qual lista contém somente soluções?',a:['5, 6, 7','0, 1, 2, 3, 4, 5','6, 7, 8','17, 18, 19'],c:1,e:'x ≤ 5. Considerando os naturais com 0, os valores de 0 a 5 satisfazem a inequação.',k:'CONJUNTO SOLUÇÃO',v:'x + 12 ≤ 17'},
{q:'Qual valor NÃO satisfaz x > 3?',a:['4','3,5','10','3'],c:3,e:'A desigualdade é estrita: 3 não é maior que 3.',k:'TESTE DE VALOR',v:'x > 3'},
{t:'info',k:'MISSÃO 2 • CIRCUNFERÊNCIA',h:'Contorno não é região interna',p:'Circunferência é o lugar geométrico dos pontos de um plano que estão à mesma distância de um ponto fixo, o centro.',v:'centro • raio • diâmetro • corda • arco',note:'O círculo inclui a região interna. A circunferência é o contorno.'},
{q:'Qual segmento liga o centro a um ponto da circunferência?',a:['Corda','Diâmetro','Raio','Arco'],c:2,e:'Esse segmento é o raio.',k:'ELEMENTOS',kind:'circle'},
{q:'Qual definição corresponde ao diâmetro?',a:['Qualquer arco da circunferência','Uma corda que passa pelo centro','Metade de uma corda','Um ponto fixo'],c:1,e:'O diâmetro é uma corda que passa pelo centro e mede o dobro do raio.',k:'ELEMENTOS',kind:'circle'},
{q:'Uma circunferência tem raio 6 cm. Qual é o diâmetro?',a:['3 cm','6 cm','18 cm','12 cm'],c:3,e:'d = 2r = 12 cm.',k:'RAIO E DIÂMETRO',v:'r = 6 cm'},
{q:'Uma circunferência tem diâmetro 18 cm. Qual é o raio?',a:['9 cm','36 cm','18 cm','6 cm'],c:0,e:'O raio é a metade do diâmetro: 9 cm.',k:'RAIO E DIÂMETRO',v:'d = 18 cm'},
{t:'info',k:'COMPRIMENTO DA CIRCUNFERÊNCIA',h:'π conecta a volta ao diâmetro',p:'O material apresenta π como o quociente entre o comprimento C e o diâmetro d. Nas atividades, usa-se π ≈ 3,14.',v:'π = C/d  •  C = π·d',note:'Se você conhece o raio, primeiro pode obter d = 2r.'},
{q:'Com d = 10 cm e π ≈ 3,14, qual é o comprimento?',a:['13,14 cm','31,4 cm','6,28 cm','314 cm'],c:1,e:'C = π·d = 3,14·10 = 31,4 cm.',k:'COMPRIMENTO',kind:'circle'},
{q:'Com r = 4 cm, qual é aproximadamente o comprimento da circunferência?',a:['12,56 cm','8 cm','25,12 cm','50,24 cm'],c:2,e:'d=8 cm. C=3,14·8=25,12 cm.',k:'COMPRIMENTO',kind:'circle'},
{q:'Se C = 18,84 cm e π ≈ 3,14, qual é o diâmetro?',a:['6 cm','3 cm','9,42 cm','59,1576 cm'],c:0,e:'d = C/π = 18,84/3,14 = 6 cm.',k:'CAMINHO INVERSO',v:'π = C/d'},
{q:'Se C = 31,4 cm, qual é o raio?',a:['10 cm','31,4 cm','15,7 cm','5 cm'],c:3,e:'d=31,4/3,14=10 cm; raio=5 cm.',k:'CAMINHO INVERSO',kind:'circle'},
{t:'info',k:'MISSÃO 3 • ÁREAS',h:'Área mede superfície',p:'O material usa unidades quadradas e mostra que, ao passar de uma unidade de área para a unidade vizinha, o fator é 100.',v:'m² ↔ dm² ↔ cm² ↔ mm²',note:'Em medidas de área, cada salto é ×100 ou ÷100, não ×10.'},
{q:'Converta 5 m² para dm².',a:['50 dm²','500 dm²','5 000 dm²','0,05 dm²'],c:1,e:'De m² para dm²: um salto para a direita, ×100. 5×100=500.',k:'UNIDADES DE ÁREA',v:'m² → dm²'},
{q:'Converta 7 mm² para cm².',a:['700 cm²','0,7 cm²','0,07 cm²','70 cm²'],c:2,e:'De mm² para cm²: um salto para a esquerda, ÷100. 7÷100=0,07.',k:'UNIDADES DE ÁREA',v:'mm² → cm²'},
{q:'Converta 890 cm² para m².',a:['8,9 m²','0,089 m²','89 m²','0,89 m²'],c:1,e:'cm² → dm² → m²: dois saltos à esquerda, ÷10 000. 890÷10 000=0,089.',k:'UNIDADES DE ÁREA',v:'cm² → m²'},
{q:'Converta 4,9 dam² para m².',a:['49 m²','0,049 m²','4 900 m²','490 m²'],c:3,e:'dam² → m²: um salto à direita, ×100. 4,9×100=490.',k:'UNIDADES DE ÁREA',v:'dam² → m²'},
{t:'info',k:'FÓRMULAS DO MATERIAL',h:'Quatro polígonos, três ideias',p:'Retângulo e paralelogramo usam base × altura. Quadrado usa lado × lado. Triângulo usa metade do produto base × altura.',v:'Aret=b·h  •  Aquad=l²  •  Apar=b·h  •  Atri=b·h/2'},
{q:'Retângulo de base 9 cm e altura 4 cm. Área?',a:['13 cm²','26 cm²','36 cm²','72 cm²'],c:2,e:'A=b·h=9·4=36 cm².',k:'RETÂNGULO',v:'9 cm × 4 cm'},
{q:'Quadrado de lado 7 cm. Área?',a:['14 cm²','49 cm²','28 cm²','21 cm²'],c:1,e:'A=l²=7·7=49 cm².',k:'QUADRADO',v:'l = 7 cm'},
{q:'Paralelogramo com base 12 cm e altura 5 cm. Área?',a:['60 cm²','34 cm²','30 cm²','17 cm²'],c:0,e:'A=b·h=12·5=60 cm². A altura é perpendicular à base.',k:'PARALELOGRAMO',kind:'poly'},
{q:'Triângulo com base 10 cm e altura 6 cm. Área?',a:['60 cm²','16 cm²','30 cm²','120 cm²'],c:2,e:'A=(b·h)/2=(10·6)/2=30 cm².',k:'TRIÂNGULO',kind:'tri'},
{q:'Um triângulo tem base 8 cm e altura 9 cm. Qual cálculo está correto?',a:['8+9','8·9','(8·9)/2','(8+9)/2'],c:2,e:'Área do triângulo é base vezes altura, dividido por 2.',k:'TRIÂNGULO',kind:'tri'},
{q:'Um paralelogramo tem área 48 cm² e base 8 cm. Qual é a altura?',a:['6 cm','40 cm','8 cm','384 cm'],c:0,e:'48=8·h, então h=6 cm.',k:'PARALELOGRAMO',kind:'poly'},
{t:'info',k:'MISSÃO 4 • DECOMPOSIÇÃO',h:'Uma figura difícil pode virar várias fáceis',p:'O material decompõe figuras em retângulos, quadrados, paralelogramos e triângulos, calcula as partes e soma as áreas.',v:'área total = área 1 + área 2 + ...',note:'Também é possível completar uma figura maior e retirar a parte inserida, quando isso simplifica o cálculo.'},
{q:'Uma figura é formada, sem sobreposição, por retângulos 6×2 e 3×4. Qual a área total?',a:['18 cm²','24 cm²','30 cm²','36 cm²'],c:1,e:'6·2=12 e 3·4=12. Total=24 cm².',k:'DECOMPOSIÇÃO',kind:'grid'},
{q:'Uma figura é formada por um retângulo 4×2, outro 1×3 e um triângulo de base 3 e altura 3. Área total?',a:['15,5 cm²','12 cm²','17 cm²','20 cm²'],c:0,e:'8 + 3 + (3·3)/2 = 8+3+4,5 = 15,5 cm².',k:'DECOMPOSIÇÃO',kind:'grid'},
{q:'Um hexágono foi dividido em 6 triângulos iguais. Cada triângulo tem base 60 cm e altura 52 cm. Qual a área total?',a:['1 560 cm²','3 120 cm²','9 360 cm²','18 720 cm²'],c:2,e:'Cada triângulo: 60·52/2=1 560 cm². Seis: 6·1 560=9 360 cm².',k:'DECOMPOSIÇÃO',kind:'tri'},
{q:'Uma forma cabe num retângulo de 10×6, mas falta um recorte retangular de 4×3. Qual é sua área?',a:['72 cm²','48 cm²','36 cm²','24 cm²'],c:1,e:'Área maior 60; recorte 12. 60−12=48 cm².',k:'COMPLETAR E RETIRAR',kind:'grid'},
{t:'info',k:'MISSÃO FINAL',h:'Misture as ferramentas',p:'Agora não há placa dizendo qual assunto usar. Leia, escolha a estratégia e resolva.',v:'inequações • circunferência • áreas • decomposição'},
{q:'Uma peça só cabe se 3x ≤ 27. Qual é a condição para x?',a:['x ≥ 9','x < 9','x ≤ 9','x > 9'],c:2,e:'Dividimos por 3 positivo, então o sinal permanece: x≤9.',k:'DESAFIO MISTO',v:'3x ≤ 27'},
{q:'Uma roda tem raio 7 cm. Usando π≈3,14, qual é o comprimento?',a:['21,98 cm','43,96 cm','153,86 cm','14 cm'],c:1,e:'d=14; C=3,14·14=43,96 cm.',k:'DESAFIO MISTO',kind:'circle'},
{q:'Um piso tem um paralelogramo de base 8 m e altura 4 m mais um triângulo de base 6 m e altura 3 m. Área total?',a:['41 m²','50 m²','32 m²','73 m²'],c:0,e:'Paralelogramo:32. Triângulo:9. Total:41 m².',k:'DESAFIO MISTO',kind:'poly'},
{q:'Resolva: 4x + 5 > 7x − 10.',a:['x > 5','x < −5','x < 5','x ≥ 5'],c:2,e:'4x−7x > −10−5 → −3x>−15. Dividindo por −3, inverte: x<5.',k:'DESAFIO MISTO',v:'4x + 5 > 7x − 10'},
{t:'final',k:'RELATÓRIO FINAL',h:'Treinamento concluído',p:'Seu relatório separa os erros por assunto. O melhor alvo para uma última revisão é o bloco com mais tentativas incorretas.'}
];
const KEY='jujuba-mat-r2-v1';let st=JSON.parse(localStorage.getItem(KEY)||'null')||{i:0,done:{},tries:{}};if(st.i>=screens.length)st.i=0;
const groups=i=>i<=17?'Inequações':i<=27?'Circunferência':i<=38?'Áreas e unidades':i<=42?'Decomposição':'Misto';
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function visual(s){if(s.kind==='circle')return '<div class="circle"><i class="dia"></i><i class="rad"></i></div>';if(s.kind==='poly')return '<div class="poly"></div>';if(s.kind==='tri')return '<div class="tri"></div>';if(s.kind==='grid')return '<div class="gridshape">'+Array.from({length:30},(_,i)=>'<i class="sq '+([4,5,10,11,16,17].includes(i)?'off':'')+'"></i>').join('')+'</div>';if((s.v||'').includes('≤')||(s.v||'').includes('>')||(s.v||'').includes('<'))return '<div class="balance"><span class="pan l">1º membro</span><span class="pan r">2º membro</span></div><div class="formula">'+s.v+'</div>';return '<div class="big">∑</div><div class="formula">'+(s.v||'Matemática em ação')+'</div>'}
function report(){let m={};Object.keys(st.tries).forEach(k=>{let i=+k;m[groups(i)]=(m[groups(i)]||0)+Math.max(0,st.tries[k]-1)});return ['Inequações','Circunferência','Áreas e unidades','Decomposição','Misto'].map(g=>'<div class="'+((m[g]||0)===0?'good':'')+'"><b>'+g+'</b> '+(m[g]||0)+' tentativa(s) incorreta(s)</div>').join('')}
function render(){let s=screens[st.i],answered=!!st.done[st.i],q=!!s.q;document.getElementById('step').textContent=(st.i+1)+'/'+screens.length;document.getElementById('bar').style.width=(100*st.i/(screens.length-1))+'%';let done=Object.keys(st.done).length,total=screens.filter(x=>x.q).length;document.getElementById('score').textContent=done+'/'+total;
let left='<div class="art"><div class="visual">'+visual(s)+'</div></div>',body='<span class="kicker">'+s.k+'</span><h'+(s.t==='cover'?1:2)+'>'+s.h+'</h'+(s.t==='cover'?1:2)+'><p>'+s.p+'</p>';
if(s.note)body+='<div class="note">'+s.note+'</div>';if(q){body+='<div class="choices">'+s.a.map((x,j)=>'<button '+(answered?'disabled':'')+' onclick="answer('+j+',this)">'+x+'</button>').join('')+'</div><div id="fb" class="feedback '+(answered?'ok':'')+'">'+(answered?'✓ Resolvido. '+s.e:'')+'</div>'}
if(s.t==='final')body+='<div class="report">'+report()+'</div><div class="note"><b>Dica da Jujuba:</b> erro aqui não é derrota. É um mapa dizendo exatamente onde revisar.</div>';
let nav='<div class="nav">'+(st.i>0?'<button class="back" onclick="go(-1)">← Anterior</button>':'')+(s.t==='final'?'<button class="next" onclick="restart()">Recomeçar revisão</button>':'<button id="next" class="next" '+(q&&!answered?'disabled':'')+' onclick="go(1)">'+(st.i===0?'Começar treinamento →':'Próxima →')+'</button>')+'</div>';document.getElementById('root').innerHTML='<section class="scene">'+left+'<div class="panel">'+body+nav+'</div></section>'}
function answer(j,b){let s=screens[st.i];st.tries[st.i]=(st.tries[st.i]||0)+1;if(j===s.c){st.done[st.i]=true;save();b.classList.add('correct');document.querySelectorAll('.choices button').forEach(x=>x.disabled=true);let f=document.getElementById('fb');f.className='feedback ok';f.textContent='✓ '+s.e;document.getElementById('next').disabled=false}else{save();b.classList.add('wrong');b.disabled=true;let f=document.getElementById('fb');f.className='feedback bad';f.textContent='Ainda não. Releia a relação ou faça a conta por etapas e tente outra alternativa.'}}
function go(d){if(d>0&&screens[st.i].q&&!st.done[st.i])return;st.i=Math.max(0,Math.min(screens.length-1,st.i+d));save();render();scrollTo({top:0,behavior:'smooth'})}
function restart(){if(confirm('Apagar o progresso desta Revisão 2 e começar novamente?')){localStorage.removeItem(KEY);st={i:0,done:{},tries:{}};render()}}
render();
</script></body></html>
