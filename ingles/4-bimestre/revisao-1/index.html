<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inglês • 4º Bimestre • Revisão 1</title><style>body{margin:0;background:#eef3f9;color:#192943;font-family:system-ui,Segoe UI,sans-serif}main{max-width:870px;margin:auto;padding:20px}.panel{background:white;border-radius:22px;padding:28px;box-shadow:0 12px 38px #1c45611a}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.pill{background:#dceee5;color:#14664b;padding:7px 14px;border-radius:50px;font-size:14px}.progress{height:11px;border-radius:10px;background:#dde6f0;overflow:hidden;margin:17px 0}.bar{height:100%;background:linear-gradient(90deg,#18a67e,#6a8eea);transition:width .25s}h1{font-size:clamp(25px,5vw,38px);margin:10px 0 18px}h2{font-size:25px}p{line-height:1.8;font-size:19px}.words{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.word{border:1px solid #8bbfae;background:#f0fbf5;border-radius:9px;padding:10px;cursor:pointer;font-size:16px}.word .tr{display:none;color:#175a47}.word:hover .tr,.word:focus .tr,.word.active .tr{display:inline}button{cursor:pointer;border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:650}.choice{display:block;text-align:left;width:100%;margin:9px 0;background:#f1f5fb;border:2px solid #e2e8f4}.choice.selected{border-color:#456fd6;background:#e7eeff}.primary{background:#2764d7;color:white}.secondary{background:#e7ecf4;color:#253c65}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.hint{background:#fff7db;border-left:5px solid #efb94f;border-radius:10px;padding:13px;margin:18px 0;line-height:1.65}.feedback{padding:14px;border-radius:12px;margin-top:12px;background:#eaf4ff;font-size:17px}.wrong{background:#ffe9e6}.right{background:#e4f7eb}textarea{width:100%;box-sizing:border-box;min-height:110px;border-radius:12px;border:1px solid #a7b5ca;padding:14px;font:17px system-ui}.muted{color:#5c6880}small{font-size:14px}footer{padding:18px 0;text-align:center;color:#596478}@media(max-width:520px){.panel{padding:18px}p{font-size:17px}.nav button{padding:12px}} </style></head><body><main><header><div><b>📗 Inglês • 4º Bimestre • Revisão 1</b><div class="muted">Unidades 8 e 9 • Conceitos + vocabulário</div></div><div class="pill">⏱️ <span id="clock">00:00</span> <button id="pause" class="secondary">Pausar</button></div></header><div class="progress"><div id="bar" class="bar"></div></div><div class="muted" id="counter"></div><section id="content" class="panel"></section><div class="nav"><button id="prev" class="secondary">← Anterior</button><div class="pill" id="score">⭐ 0 pontos</div><button id="next" class="primary">Próxima →</button></div><footer>Treine sem pressa. A meta é compreender, lembrar e escrever. • Tempo sugerido: 40–50 min</footer></main><script>const SLIDES=[{"kind": "lesson", "title": "Missão 1 • Um mapa de palavras", "body": "<p>Hoje vamos aprender a reconhecer palavras de lugares, dizer o que <b>existia</b> no passado e contar o que alguém <b>fez</b>.</p><p>Leia as frases com calma. Toque nas palavras em inglês para revelar traduções. Você encontrará as mesmas palavras várias vezes, em contextos diferentes.</p>", "words": [["city", "cidade"], ["town", "cidade pequena"], ["place", "lugar"], ["past", "passado"], ["ago", "atrás / há (tempo)"]], "tip": "Meta: reconhecer as palavras antes de tentar memorizar a escrita."}, {"kind": "lesson", "title": "Places in the city • Lugares na cidade", "body": "<p><b>Park</b> = parque; <b>market</b> = mercado; <b>zoo</b> = zoológico; <b>museum</b> = museu; <b>stadium</b> = estádio.</p><p>Exemplo: <i>There is a park in my town.</i> = Existe um parque na minha cidade.</p>", "words": [["park", "parque"], ["market", "mercado"], ["zoo", "zoológico"], ["museum", "museu"], ["stadium", "estádio"]], "tip": null}, {"kind": "quiz", "title": "Identifique o lugar", "prompt": "Onde podemos ver leões e girafas?", "choices": ["market", "zoo", "bus station", "museum"], "correct": 1, "explanation": "<b>Zoo</b> significa zoológico.", "topic": "Lugares"}, {"kind": "quiz", "title": "Vocabulário na prática", "prompt": "“Museum” significa:", "choices": ["mercado", "museu", "parque", "estádio"], "correct": 1, "explanation": "Museum = museu; market = mercado.", "topic": "Lugares"}, {"kind": "lesson", "title": "Mais lugares", "body": "<p><b>Bus station</b> = rodoviária/terminal de ônibus; <b>subway</b> = metrô; <b>movie theater</b> = cinema; <b>street</b> = rua; <b>square</b> = praça.</p><p>O livro mostra também <b>cinema</b> (inglês britânico) e <b>underground / Tube</b> (metrô de Londres).</p>", "words": [["bus station", "rodoviária"], ["subway", "metrô"], ["movie theater", "cinema"], ["street", "rua"], ["square", "praça"]], "tip": null}, {"kind": "quiz", "title": "Lugar ou transporte?", "prompt": "Complete: “We watched a movie at the ____.”", "choices": ["stadium", "movie theater", "zoo", "park"], "correct": 1, "explanation": "<b>Movie theater</b> = cinema.", "topic": "Lugares"}, {"kind": "quiz", "title": "Repetição estratégica", "prompt": "“Square”, no vocabulário de lugares da cidade, significa:", "choices": ["quadrado geométrico", "praça", "rua", "estação"], "correct": 1, "explanation": "Neste contexto, square = praça.", "topic": "Lugares"}, {"kind": "lesson", "title": "Tradução em contexto", "body": "<p><i>I went to the market.</i> = Fui ao mercado.<br><i>She visited the museum.</i> = Ela visitou o museu.<br><i>We played in the park.</i> = Brincamos no parque.</p><p>Perceba como <b>went</b>, <b>visited</b> e <b>played</b> indicam ações concluídas no passado.</p>", "words": [["went", "fui / foi / fomos (go)"], ["visited", "visitou / visitei"], ["played", "brincou / jogou"]], "tip": null}, {"kind": "quiz", "title": "Tradução contextual", "prompt": "“Bus station” é:", "choices": ["estação de ônibus", "estádio", "centro da cidade", "museu"], "correct": 0, "explanation": "Bus = ônibus; station = estação.", "topic": "Lugares"}, {"kind": "write", "title": "Escreva 3 palavras", "prompt": "Escreva em inglês: parque, zoológico e praça (separe por vírgulas).", "model": "park, zoo, square", "topic": "Lugares"}, {"kind": "lesson", "title": "Missão 2 • Existia ou existiam?", "body": "<p>No presente dizemos <b>there is</b> (existe / há) e <b>there are</b> (existem / há). No passado usamos:</p><p><b>There was</b> = havia/existia <b>uma</b> coisa.<br><b>There were</b> = havia/existiam <b>várias</b> coisas.</p><p><i>There was a park.</i> = Havia um parque.<br><i>There were two museums.</i> = Havia dois museus.</p>", "words": [["there was", "havia / existia (singular)"], ["there were", "havia / existiam (plural)"]], "tip": "Não traduza “there” isoladamente: aprenda a estrutura inteira."}, {"kind": "quiz", "title": "Singular ou plural?", "prompt": "____ a zoo in the town fifty years ago.", "choices": ["There were", "There was", "There are", "Were there"], "correct": 1, "explanation": "Um zoológico (singular): <b>There was</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Singular ou plural?", "prompt": "____ three markets in the city.", "choices": ["There was", "There were", "There is", "Was there"], "correct": 1, "explanation": "Three markets = plural: <b>There were</b>.", "topic": "There was/were"}, {"kind": "lesson", "title": "Como negar no passado", "body": "<p><b>There wasn’t</b> = não havia/não existia (singular).<br><b>There weren’t</b> = não havia/não existiam (plural).</p><p><i>There wasn’t a subway.</i> = Não havia metrô.<br><i>There weren’t any computers.</i> = Não havia computadores.</p><p><b>Erro comum:</b> ❌ There was two museums. ✅ There were two museums.</p>", "words": [["wasn’t", "was not / não havia no singular"], ["weren’t", "were not / não havia no plural"], ["any", "nenhum(a) / alguns, conforme a frase"]], "tip": null}, {"kind": "quiz", "title": "Negação correta", "prompt": "Não havia um estádio:", "choices": ["There weren’t a stadium.", "There wasn’t a stadium.", "There wasn’t stadiums.", "There were a stadium."], "correct": 1, "explanation": "A stadium = singular. Use there wasn’t.", "topic": "There was/were"}, {"kind": "quiz", "title": "Negação correta", "prompt": "Não havia dois museus:", "choices": ["There wasn’t two museums.", "There weren’t two museums.", "There was two museums.", "There is two museums."], "correct": 1, "explanation": "Two museums = plural. Use there weren’t.", "topic": "There was/were"}, {"kind": "lesson", "title": "O que significa ago?", "body": "<p><b>Ago</b> marca quanto tempo se passou: <i>one hour ago</i> = há uma hora; <i>three days ago</i> = há três dias; <i>fifty years ago</i> = há cinquenta anos.</p><p>No livro: <i>There was a high school fifty years ago.</i> = Havia uma escola de ensino médio há cinquenta anos.</p>", "words": [["one hour ago", "há uma hora"], ["three days ago", "há três dias"], ["fifty years ago", "há cinquenta anos"]], "tip": null}, {"kind": "quiz", "title": "Tempo passado", "prompt": "“Ten years ago” significa:", "choices": ["daqui a dez anos", "dez anos de idade", "há dez anos", "durante dez anos"], "correct": 2, "explanation": "Ago indica “há ... tempo”, contando para trás.", "topic": "There was/were"}, {"kind": "write", "title": "Transforme para o passado", "prompt": "Escreva em inglês: “Havia dois parques na cidade.”", "model": "There were two parks in the city.", "topic": "There was/were"}, {"kind": "lesson", "title": "Missão 3 • Simple Past", "body": "<p>Usamos o <b>Simple Past</b> para ações concluídas. Nos verbos <b>regulares</b>, geralmente acrescentamos <b>-ed</b>.</p><p><i>play → played</i> (jogar → jogou)<br><i>visit → visited</i> (visitar → visitou)<br><i>watch → watched</i> (assistir → assistiu)<br><i>listen → listened</i> (escutar → escutou)<br><i>stay → stayed</i> (ficar → ficou)</p>", "words": [["play / played", "jogar / jogou"], ["watch / watched", "assistir / assistiu"], ["visit / visited", "visitar / visitou"]], "tip": null}, {"kind": "quiz", "title": "Regular ou não?", "prompt": "Qual é o passado de “watch”?", "choices": ["watchs", "watching", "watched", "watches"], "correct": 2, "explanation": "Watch é regular: watched.", "topic": "Simple Past"}, {"kind": "quiz", "title": "Reconheça o passado", "prompt": "“We visited the zoo yesterday.” significa:", "choices": ["Visitaremos o zoológico amanhã.", "Visitamos o zoológico ontem.", "Visitamos o zoo todos os dias.", "Não visitamos o zoo."], "correct": 1, "explanation": "Visited = visitamos; yesterday = ontem.", "topic": "Simple Past"}, {"kind": "lesson", "title": "Verbos irregulares • aprender por pares", "body": "<p>Alguns verbos mudam de forma. Não basta acrescentar -ed:</p><p><b>go → went</b> (ir → foi)<br><b>have → had</b> (ter → teve)<br><b>eat → ate</b> (comer → comeu)<br><b>see → saw</b> (ver → viu)<br><b>take → took</b> (pegar/levar → pegou/levou)<br><b>buy → bought</b> (comprar → comprou)</p>", "words": [["go / went", "ir / foi"], ["have / had", "ter / teve"], ["eat / ate", "comer / comeu"], ["see / saw", "ver / viu"], ["take / took", "pegar / pegou"], ["buy / bought", "comprar / comprou"]], "tip": null}, {"kind": "quiz", "title": "Irregulares", "prompt": "Qual é o passado de “go”?", "choices": ["goed", "goes", "went", "gone"], "correct": 2, "explanation": "Go → went. Repita em voz alta.", "topic": "Simple Past"}, {"kind": "quiz", "title": "Irregulares", "prompt": "Qual é o passado de “eat”?", "choices": ["eated", "ate", "eats", "eating"], "correct": 1, "explanation": "Eat → ate.", "topic": "Simple Past"}, {"kind": "quiz", "title": "Irregulares", "prompt": "“She saw a giraffe.” significa:", "choices": ["Ela viu uma girafa.", "Ela comprou uma girafa.", "Ela levou uma girafa.", "Ela viu um estádio."], "correct": 0, "explanation": "Saw é o passado de see = ver.", "topic": "Simple Past"}, {"kind": "lesson", "title": "Mais verbos que aparecem nos textos", "body": "<p><b>come → came</b> (vir → veio), <b>get → got</b> (conseguir/chegar → conseguiu/chegou), <b>feel → felt</b> (sentir → sentiu), <b>make → made</b> (fazer → fez), <b>write → wrote</b> (escrever → escreveu).</p><p>Treine com <i>I felt happy</i> (Eu me senti feliz) e <i>We went to the park</i> (Fomos ao parque).</p>", "words": [["came", "veio"], ["got", "chegou / conseguiu"], ["felt", "sentiu"], ["made", "fez"], ["wrote", "escreveu"]], "tip": null}, {"kind": "quiz", "title": "Passado irregular", "prompt": "“They bought food at the market.” O verbo <i>bought</i> vem de:", "choices": ["bring", "buy", "build", "be"], "correct": 1, "explanation": "Buy → bought = comprar → comprou/compraram.", "topic": "Simple Past"}, {"kind": "lesson", "title": "A negativa com didn’t", "body": "<p>A fórmula é <b>sujeito + didn’t + verbo na forma base</b>.</p><p>✅ <i>She didn’t go to the zoo.</i> = Ela não foi ao zoológico.<br>❌ <i>She didn’t went to the zoo.</i></p><p>✅ <i>We didn’t watch the movie.</i> = Nós não assistimos ao filme.</p><p>O <b>didn’t</b> já carrega o passado; o outro verbo volta ao normal.</p>", "words": [["didn’t", "did not / não (passado)"], ["go", "ir"], ["watch", "assistir"]], "tip": null}, {"kind": "quiz", "title": "Corrija mentalmente", "prompt": "Qual frase está correta?", "choices": ["She didn’t went to the park.", "She didn’t go to the park.", "She not went to the park.", "She didn’t goes to the park."], "correct": 1, "explanation": "Depois de didn’t, use GO, não went.", "topic": "Simple Past"}, {"kind": "quiz", "title": "Negativa", "prompt": "Complete: “They ____ visit the museum yesterday.”", "choices": ["wasn’t", "didn’t", "weren’t", "don’t"], "correct": 1, "explanation": "Para negar uma ação no Simple Past: didn’t + visit.", "topic": "Simple Past"}, {"kind": "lesson", "title": "Was/were não são verbos de ação comuns", "body": "<p>O passado de <b>am/is</b> é <b>was</b>; o passado de <b>are</b> é <b>were</b>.</p><p><i>I was tired.</i> = Eu estava cansada.<br><i>They were happy.</i> = Eles estavam felizes.<br><i>She wasn’t at school.</i> = Ela não estava na escola.</p><p>Com <b>was/were</b>, negamos diretamente; não precisamos de <b>didn’t</b>.</p>", "words": [["was", "era / estava"], ["were", "eram / estavam"], ["tired", "cansado(a)"], ["happy", "feliz"]], "tip": null}, {"kind": "quiz", "title": "Past of be", "prompt": "“They ____ at the park yesterday.”", "choices": ["was", "were", "is", "am"], "correct": 1, "explanation": "They é plural: were.", "topic": "Simple Past"}, {"kind": "quiz", "title": "Compare as estruturas", "prompt": "Qual frase está correta?", "choices": ["I didn’t was hungry.", "I wasn’t hungry.", "I weren’t hungry.", "I not was hungry."], "correct": 1, "explanation": "Com be, use wasn’t / weren’t sem didn’t.", "topic": "Simple Past"}, {"kind": "lesson", "title": "Missão 4 • Ler e compreender", "body": "<p><b>Texto criado para treinar o conteúdo do livro:</b></p><p><i>Ten years ago, there was a small park in my town. There weren’t many stores. Last Saturday, I went to the city center with my family. We visited a museum, bought food at the market, and watched a movie. We didn’t go to the zoo.</i></p><p>Dica: <b>stores</b> = lojas; <b>last Saturday</b> = sábado passado; <b>with my family</b> = com minha família.</p>", "words": [["store", "loja"], ["last Saturday", "sábado passado"], ["with my family", "com minha família"], ["city center", "centro da cidade"]], "tip": null}, {"kind": "quiz", "title": "Compreensão do texto", "prompt": "O que existia na cidade há dez anos?", "choices": ["um pequeno parque", "três museus", "um zoológico", "uma estação de metrô"], "correct": 0, "explanation": "O texto diz: there was a small park.", "topic": "Leitura"}, {"kind": "quiz", "title": "Compreensão do texto", "prompt": "O que a família NÃO fez no sábado?", "choices": ["visitou um museu", "comprou comida", "foi ao zoológico", "assistiu a um filme"], "correct": 2, "explanation": "We didn’t go to the zoo = não fomos ao zoológico.", "topic": "Leitura"}, {"kind": "quiz", "title": "Repetindo vocabulário", "prompt": "No texto, “bought” quer dizer:", "choices": ["visitou", "comprou", "andou", "viu"], "correct": 1, "explanation": "Buy → bought = comprar → comprou.", "topic": "Leitura"}, {"kind": "lesson", "title": "Desafio final • Misture as peças", "body": "<p>Agora você verá palavras conhecidas em frases diferentes. Traduza mentalmente antes de escolher.</p><p>Lembretes rápidos:<br><b>There was</b> = singular no passado.<br><b>There were</b> = plural no passado.<br><b>Verb + -ed</b> = regular.<br><b>Went, saw, ate</b> = irregulares.<br><b>Didn’t + verbo base</b> = negativa.</p>", "words": [], "tip": null}, {"kind": "quiz", "title": "Chefão 1 de 5", "prompt": "“There ____ a museum in the city 100 years ago.”", "choices": ["were", "was", "are", "weren’t"], "correct": 1, "explanation": "A museum é singular: there was.", "topic": "Desafio final"}, {"kind": "quiz", "title": "Chefão 2 de 5", "prompt": "Qual é a tradução de “street”?", "choices": ["praça", "rua", "estádio", "cinema"], "correct": 1, "explanation": "Street = rua.", "topic": "Desafio final"}, {"kind": "quiz", "title": "Chefão 3 de 5", "prompt": "“Yesterday, he ____ fish.”", "choices": ["eat", "eated", "ate", "eats"], "correct": 2, "explanation": "Eat → ate (irregular).", "topic": "Desafio final"}, {"kind": "quiz", "title": "Chefão 4 de 5", "prompt": "“We didn’t ____ the movie.”", "choices": ["watched", "watching", "watches", "watch"], "correct": 3, "explanation": "Depois de didn’t, verbo base: watch.", "topic": "Desafio final"}, {"kind": "quiz", "title": "Chefão 5 de 5", "prompt": "“There ____ two bus stations in this town.”", "choices": ["were", "was", "is", "wasn’t"], "correct": 0, "explanation": "Two bus stations = plural: were.", "topic": "Desafio final"}, {"kind": "write", "title": "Produção final • 3 frases", "prompt": "Escreva em inglês: (1) Havia um parque. (2) Nós visitamos o museu. (3) Eu não fui ao zoológico.", "model": "There was a park. / We visited the museum. / I didn’t go to the zoo.", "topic": "Produção escrita"}]; let idx=0,sec=0,paused=false;let responses={},graded={};const el=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let s=SLIDES[idx],tot=SLIDES.length;el('bar').style.width=((idx+1)/tot*100)+'%';el('counter').textContent='Página '+(idx+1)+' de '+tot+' • '+(s.kind==='lesson'?'Aprenda':s.kind==='quiz'?'Pratique':'Escreva');el('prev').disabled=idx===0;el('next').textContent=idx===tot-1?'Ver resultados →':'Próxima →';let html='<h1>'+esc(s.title)+'</h1>';if(s.kind==='lesson'){html+=s.body;if(s.words?.length){html+='<h2>Toque para traduzir</h2><div class="words">'+s.words.map(w=>'<button class="word" onclick="this.classList.toggle(&quot;active&quot;)"><b>'+esc(w[0])+'</b><span class="tr"> • '+esc(w[1])+'</span></button>').join('')+'</div>';}if(s.tip)html+='<div class="hint">💡 '+esc(s.tip)+'</div>';}if(s.kind==='quiz'){html+='<p>'+s.prompt+'</p>'+s.choices.map((c,i)=>'<button class="choice '+(responses[idx]===i?'selected':'')+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('');html+='<button class="primary" onclick="check()">Conferir resposta</button><div id="fb">'+(graded[idx]!==undefined?fb(s):'')+'</div>';}if(s.kind==='write'){html+='<p>'+esc(s.prompt)+'</p><textarea placeholder="Escreva a sua resposta aqui..." oninput="responses['+idx+']=this.value">'+esc(responses[idx]||'')+'</textarea><p><button class="secondary" onclick="showModel()">Ver exemplo para comparar</button></p><div id="fb">'+(graded[idx]?'💡 Resposta-modelo: '+esc(s.model):'')+'</div>';}el('content').innerHTML=html;let points=Object.entries(graded).reduce((p,[k,v])=>p+(SLIDES[k].kind==='quiz'&&v?10:0),0);el('score').textContent='⭐ '+points+' pontos';}function pick(i){responses[idx]=i;render()}function fb(s){return '<div class="feedback '+(graded[idx]?'right':'wrong')+'">'+(graded[idx]?'✅ Acertou! ':'🔎 Vamos ajustar: ')+s.explanation+'</div>'}function check(){let s=SLIDES[idx];if(responses[idx]===undefined){el('fb').innerHTML='<div class="hint">Escolha uma alternativa antes de conferir.</div>';return;}graded[idx]=responses[idx]===s.correct;render()}function showModel(){graded[idx]=true;render()}function result(){let qs=SLIDES.filter(s=>s.kind==='quiz').length,correct=Object.keys(graded).filter(k=>SLIDES[k].kind==='quiz'&&graded[k]).length;let topics={};SLIDES.forEach((s,i)=>{if(s.kind==='quiz'){topics[s.topic]??=[0,0];topics[s.topic][1]++;if(graded[i])topics[s.topic][0]++}});el('counter').textContent='Jornada concluída';el('bar').style.width='100%';el('content').innerHTML='<h1>🏅 Missão concluída!</h1><h2>'+correct+' de '+qs+' questões corretas ('+Math.round(correct/qs*100)+'%)</h2><p>Tempo de estudo: '+el('clock').textContent+'.</p><h2>Diagnóstico por assunto</h2>'+Object.entries(topics).map(([k,v])=>'<p><b>'+esc(k)+':</b> '+v[0]+'/'+v[1]+'</p>').join('')+'<div class="hint">Releia os assuntos com menor pontuação. No próximo treino, você encontrará novas frases com as mesmas palavras.</div><button class="primary" onclick="idx=0;render()">Revisar desde o começo</button>';el('prev').disabled=true;el('next').style.display='none';}el('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};el('next').onclick=()=>{if(idx<SLIDES.length-1){idx++;render()}else result()};el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar'};setInterval(()=>{if(!paused){sec++;el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000);document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('prev').click()});render();</script></body></html>
