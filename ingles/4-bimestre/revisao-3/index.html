, ["street", "rua"], ["bus station", "rodoviária"], ["subway", "metrô"], ["movie theater", "cinema"], ["city center", "centro da cidade"]], "tip": ""}, {"kind": "quiz", "title": "Radar de palavras 1", "prompt": "O que significa <b>park</b>?", "choices": ["cinema", "rua", "parque", "centro da cidade"], "correct": 2, "explanation": "<b>park</b> = parque. Use esta palavra numa frase: I went to the park.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 2", "prompt": "O que significa <b>market</b>?", "choices": ["rua", "praça", "mercado", "metrô"], "correct": 2, "explanation": "<b>market</b> = mercado. Use esta palavra numa frase: I went to the market.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 3", "prompt": "O que significa <b>museum</b>?", "choices": ["rua", "zoológico", "museu", "praça"], "correct": 2, "explanation": "<b>museum</b> = museu. Use esta palavra numa frase: I went to the museum.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 4", "prompt": "O que significa <b>zoo</b>?", "choices": ["cinema", "museu", "zoológico", "parque"], "correct": 2, "explanation": "<b>zoo</b> = zoológico. Use esta palavra numa frase: I went to the zoo.", "topic": "Vocabulário"}, {"kind": "write", "title": "Microescrita • Lugares", "prompt": "Escreva em inglês: “Fui ao parque e visitei o museu.”", "model": "I went to the park and visited the museum.", "topic": "Escrita"}, {"kind": "quiz", "title": "Radar de palavras 5", "prompt": "O que significa <b>stadium</b>?", "choices": ["estádio", "museu", "cinema", "zoológico"], "correct": 0, "explanation": "<b>stadium</b> = estádio. Use esta palavra numa frase: I went to the stadium.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 6", "prompt": "O que significa <b>square</b>?", "choices": ["museu", "rodoviária", "praça", "cinema"], "correct": 2, "explanation": "<b>square</b> = praça. Use esta palavra numa frase: I went to the square.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 7", "prompt": "O que significa <b>street</b>?", "choices": ["rua", "museu", "rodoviária", "mercado"], "correct": 0, "explanation": "<b>street</b> = rua. Use esta palavra numa frase: I went to the street.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 8", "prompt": "O que significa <b>bus station</b>?", "choices": ["rua", "museu", "mercado", "rodoviária"], "correct": 3, "explanation": "<b>bus station</b> = rodoviária. Use esta palavra numa frase: I went to the bus station.", "topic": "Vocabulário"}, {"kind": "write", "title": "Microescrita • Lugares", "prompt": "Escreva em inglês: “Fui ao parque e visitei o museu.”", "model": "I went to the park and visited the museum.", "topic": "Escrita"}, {"kind": "quiz", "title": "Radar de palavras 9", "prompt": "O que significa <b>subway</b>?", "choices": ["cinema", "rodoviária", "centro da cidade", "metrô"], "correct": 3, "explanation": "<b>subway</b> = metrô. Use esta palavra numa frase: I went to the subway.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 10", "prompt": "O que significa <b>movie theater</b>?", "choices": ["rodoviária", "estádio", "mercado", "cinema"], "correct": 3, "explanation": "<b>movie theater</b> = cinema. Use esta palavra numa frase: I went to the movie theater.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 11", "prompt": "O que significa <b>city center</b>?", "choices": ["rodoviária", "mercado", "centro da cidade", "rua"], "correct": 2, "explanation": "<b>city center</b> = centro da cidade. Use esta palavra numa frase: I went to the city center.", "topic": "Vocabulário"}, {"kind": "lesson", "title": "Missão • Havia ou não havia?", "body": "<p><b>There was</b> = havia/existia (singular). <b>There were</b> = havia/existiam (plural). <b>There wasn’t</b> e <b>there weren’t</b> são negativas.</p><p>Exemplos: <i>There was a market.</i> / <i>There weren’t two museums.</i> “Fifty years ago” = há cinquenta anos.</p>", "words": [["there was", "havia, singular"], ["there were", "havia, plural"], ["there wasn’t", "não havia, singular"], ["there weren’t", "não havia, plural"], ["ago", "há ... tempo"]], "tip": ""}, {"kind": "quiz", "title": "Máquina do tempo 1", "prompt": "Complete: “____ a small park fifty years ago.” (A frase deve ser afirmativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 0, "explanation": "um parque pequeno é singular; afirmativa → <b>There was</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 2", "prompt": "Complete: “____ two museums fifty years ago.” (A frase deve ser negativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 3, "explanation": "dois museus é plural; negativa → <b>There weren’t</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 3", "prompt": "Complete: “____ a bus station fifty years ago.” (A frase deve ser afirmativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 0, "explanation": "uma rodoviária é singular; afirmativa → <b>There was</b>.", "topic": "There was/were"}, {"kind": "write", "title": "Transformação ativa", "prompt": "Escreva uma frase completa em inglês com <b>There was</b> e <b>a bus station</b>, usando <i>ten years ago</i>.", "model": "There was a bus station ten years ago.", "topic": "Escrita"}, {"kind": "quiz", "title": "Máquina do tempo 4", "prompt": "Complete: “____ three markets fifty years ago.” (A frase deve ser negativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 3, "explanation": "três mercados é plural; negativa → <b>There weren’t</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 5", "prompt": "Complete: “____ a zoo fifty years ago.” (A frase deve ser afirmativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 0, "explanation": "um zoológico é singular; afirmativa → <b>There was</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 6", "prompt": "Complete: “____ five streets fifty years ago.” (A frase deve ser negativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 3, "explanation": "cinco ruas é plural; negativa → <b>There weren’t</b>.", "topic": "There was/were"}, {"kind": "write", "title": "Transformação ativa", "prompt": "Escreva uma frase completa em inglês com <b>There weren’t</b> e <b>five streets</b>, usando <i>ten years ago</i>.", "model": "There weren’t five streets ten years ago.", "topic": "Escrita"}, {"kind": "quiz", "title": "Máquina do tempo 7", "prompt": "Complete: “____ a movie theater fifty years ago.” (A frase deve ser afirmativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 0, "explanation": "um cinema é singular; afirmativa → <b>There was</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 8", "prompt": "Complete: “____ four stadiums fifty years ago.” (A frase deve ser negativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 3, "explanation": "quatro estádios é plural; negativa → <b>There weren’t</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 9", "prompt": "Complete: “____ a subway fifty years ago.” (A frase deve ser afirmativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 0, "explanation": "um metrô é singular; afirmativa → <b>There was</b>.", "topic": "There was/were"}, {"kind": "quiz", "title": "Máquina do tempo 10", "prompt": "Complete: “____ two parks fifty years ago.” (A frase deve ser negativa.)", "choices": ["There was", "There were", "There wasn’t", "There weren’t"], "correct": 3, "explanation": "dois parques é plural; negativa → <b>There weren’t</b>.", "topic": "There was/were"}, {"kind": "write", "title": "Transformação ativa", "prompt": "Escreva uma frase completa em inglês com <b>There weren’t</b> e <b>two parks</b>, usando <i>ten years ago</i>.", "model": "There weren’t two parks ten years ago.", "topic": "Escrita"}, {"kind": "lesson", "title": "Relembrando o passado simples", "body": "<p>Regulares acrescentam <b>-ed</b>: visit → visited, play → played, watch → watched. Alguns mudam totalmente: go → went, see → saw, eat → ate, buy → bought, take → took.</p><p>Na negativa, use <b>didn’t + verbo base</b>: <i>She didn’t go</i> (não “didn’t went”).</p>", "words": [["visit", "visited • visitar"], ["play", "played • jogar / brincar"], ["watch", "watched • assistir"], ["stay", "stayed • ficar / hospedar-se"], ["listen", "listened • escutar"], ["walk", "walked • caminhar"], ["love", "loved • adorar"], ["travel", "traveled • viajar"], ["go", "went • ir"], ["see", "saw • ver"], ["eat", "ate • comer"], ["have", "had • ter"], ["take", "took • pegar / levar"], ["buy", "bought • comprar"]], "tip": ""}, {"kind": "quiz", "title": "Verbos em ação 1", "prompt": "Qual é o passado de <b>visit</b> (visitar)?", "choices": ["visit", "played", "visited", "visits"], "correct": 2, "explanation": "<b>visit → visited</b>. Repita: Yesterday I visited...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 2", "prompt": "Qual é o passado de <b>play</b> (jogar / brincar)?", "choices": ["visited", "played", "play", "plays"], "correct": 1, "explanation": "<b>play → played</b>. Repita: Yesterday I played...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 3", "prompt": "Qual é o passado de <b>watch</b> (assistir)?", "choices": ["visited", "watch", "watchs", "watched"], "correct": 3, "explanation": "<b>watch → watched</b>. Repita: Yesterday I watched...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 4", "prompt": "Qual é o passado de <b>stay</b> (ficar / hospedar-se)?", "choices": ["stays", "visited", "stayed", "stay a usando <b>saw</b> (passado de see).", "model": "Yesterday, I saw something. (Use um complemento apropriado na sua frase.)", "topic": "Escrita"}, {"kind": "quiz", "title": "Verbos em ação 11", "prompt": "Qual é o passado de <b>eat</b> (comer)?", "choices": ["eated", "eats", "eat", "ate"], "correct": 3, "explanation": "<b>eat → ate</b>. Repita: Yesterday I ate...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 12", "prompt": "Qual é o passado de <b>have</b> (ter)?", "choices": ["have", "haves", "haveed", "had"], "correct": 3, "explanation": "<b>have → had</b>. Repita: Yesterday I had...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 13", "prompt": "Qual é o passado de <b>take</b> (pegar / levar)?", "choices": ["took", "takes", "take", "takeed"], "correct": 0, "explanation": "<b>take → took</b>. Repita: Yesterday I took...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 14", "prompt": "Qual é o passado de <b>buy</b> (comprar)?", "choices": ["buyed", "buys", "bought", "buy"], "correct": 2, "explanation": "<b>buy → bought</b>. Repita: Yesterday I bought...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 15", "prompt": "Qual é o passado de <b>feel</b> (sentir)?", "choices": ["felt", "feel", "feeled", "feels"], "correct": 0, "explanation": "<b>feel → felt</b>. Repita: Yesterday I felt...", "topic": "Simple Past"}, {"kind": "write", "title": "Escrita: verbo do passado", "prompt": "Crie uma frase curta usando <b>felt</b> (passado de feel).", "model": "Yesterday, I felt something. (Use um complemento apropriado na sua frase.)", "topic": "Escrita"}, {"kind": "quiz", "title": "Verbos em ação 16", "prompt": "Qual é o passado de <b>get</b> (obter / chegar)?", "choices": ["got", "get", "geted", "gets"], "correct": 0, "explanation": "<b>get → got</b>. Repita: Yesterday I got...", "topic": "Simple Past"}, {"kind": "quiz", "title": "Verbos em ação 17", "prompt": "Qual é o passado de <b>make</b> (fa ';el('bar').style.width='100%';el('screen').innerHTML='<h1>🏅 Missão concluída!</h1><p><b>'+right+' de '+total+' questões corretas</b> ('+Math.round(100*right/total)+'%). Respondidas: '+answered+'/'+total+'.</p><p>⏱️ Tempo: '+el('clock').textContent+' · ⭐ '+right*10+' pontos</p><h2>Seu mapa de aprendizagem</h2>'+Object.entries(topics).map(([k,v])=>'<p><b>'+safe(k)+'</b>: '+v[0]+'/'+v[1]+'</p>').join('')+'<div class="tip">Releia as questões erradas e reescreva 5 palavras que confundiu. As tarefas de escrita são autocorrigidas pela comparação com o modelo, não entram no percentual.</div><button class="primary" onclick="restart()">Rever atividades</button>';el('next').style.display='none'}el('back').onclick=()=>{if(finished){finished=false;el('next').style.display='inline-block'}idx=Math.max(0,idx-1);draw()};el('next').onclick=()=>idx===S.length-1?summary():(idx++,draw());el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar'};setInterval(()=>{if(!paused&&!finished){sec++;el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000);document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')el('back').click();if(e.key==='ArrowRight')el('next').click()});draw();</script></body></html>
