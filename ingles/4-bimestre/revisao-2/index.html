ion", "rodoviária"], ["subway", "metrô"], ["movie theater", "cinema"], ["city center", "centro da cidade"]], "tip": ""}, {"kind": "quiz", "title": "Radar de palavras 1", "prompt": "O que significa <b>park</b>?", "choices": ["praça", "parque", "mercado", "zoológico"], "correct": 1, "explanation": "<b>park</b> = parque. Use esta palavra numa frase: I went to the park.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 2", "prompt": "O que significa <b>market</b>?", "choices": ["mercado", "metrô", "centro da cidade", "parque"], "correct": 0, "explanation": "<b>market</b> = mercado. Use esta palavra numa frase: I went to the market.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 3", "prompt": "O que significa <b>museum</b>?", "choices": ["centro da cidade", "cinema", "museu", "rodoviária"], "correct": 2, "explanation": "<b>museum</b> = museu. Use esta palavra numa frase: I went to the museum.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 4", "prompt": "O que significa <b>zoo</b>?", "choices": ["rodoviária", "centro da cidade", "zoológico", "mercado"], "correct": 2, "explanation": "<b>zoo</b> = zoológico. Use esta palavra numa frase: I went to the zoo.", "topic": "Vocabulário"}, {"kind": "write", "title": "Microescrita • Lugares", "prompt": "Escreva em inglês: “Fui ao parque e visitei o museu.”", "model": "I went to the park and visited the museum.", "topic": "Escrita"}, {"kind": "quiz", "title": "Radar de palavras 5", "prompt": "O que significa <b>stadium</b>?", "choices": ["estádio", "cinema", "metrô", "museu"], "correct": 0, "explanation": "<b>stadium</b> = estádio. Use esta palavra numa frase: I went to the stadium.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 6", "prompt": "O que significa <b>square</b>?", "choices": ["centro da cidade", "museu", "rodoviária", "praça"], "correct": 3, "explanation": "<b>square</b> = praça. Use esta palavra numa frase: I went to the square.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 7", "prompt": "O que significa <b>street</b>?", "choices": ["centro da cidade", "rua", "museu", "parque"], "correct": 1, "explanation": "<b>street</b> = rua. Use esta palavra numa frase: I went to the street.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 8", "prompt": "O que significa <b>bus station</b>?", "choices": ["parque", "cinema", "mercado", "rodoviária"], "correct": 3, "explanation": "<b>bus station</b> = rodoviária. Use esta palavra numa frase: I went to the bus station.", "topic": "Vocabulário"}, {"kind": "write", "title": "Microescrita • Lugares", "prompt": "Escreva em inglês: “Fui ao parque e visitei o museu.”", "model": "I went to the park and visited the museum.", "topic": "Escrita"}, {"kind": "quiz", "title": "Radar de palavras 9", "prompt": "O que significa <b>subway</b>?", "choices": ["rodoviária", "centro da cidade", "metrô", "praça"], "correct": 2, "explanation": "<b>subway</b> = metrô. Use esta palavra numa frase: I went to the subway.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 10", "prompt": "O que significa <b>movie theater</b>?", "choices": ["praça", "cinema", "estádio", "parque"], "correct": 1, "explanation": "<b>movie theater</b> = cinema. Use esta palavra numa frase: I went to the movie theater.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Radar de palavras 11", "prompt": "O que significa <b>city center</b>?", "choices": ["centro da cidade", "metrô", "cinema", "mercado"], "correct": 0, "explanation": "<b>city center</b> = centro da cidade. Use esta palavra numa frase: I went to the city center.", "topic": "Vocabulário"}, {"kind": "lesson", "title": "Missão • Havia ou não havia?", "body": "<p><b>There was</b> = havia/existia (singular). <b>There were</b> = havia/existiam (plural). <b>There wasn’t</b> e <b>there weren’t</b> são negativas.</p><p>Exemplos: <i>There was a market.</i> / <i>There weren’t two m le": "Desarme o erro 8", "prompt": "Ontem, ela <b>não</b> fez essa ação (played). Complete: “She ____ ...”", "choices": ["didn’t play", "doesn’t played", "not play", "didn’t played"], "correct": 0, "explanation": "Depois de didn’t, usamos o verbo na forma base: <b>didn’t play</b>.", "topic": "Simple Past"}, {"kind": "lesson", "title": "Leitura guiada • Um passeio pela cidade", "body": "<p><b>Texto original para praticar o conteúdo da escola:</b> <i>Last Saturday, Mia went to the city center with her family. They visited a museum and bought food at the market. There was a small square near the museum. There weren’t any buses on that street. Mia didn’t go to the zoo because she was tired.</i></p>", "words": [["last Saturday", "sábado passado"], ["bought", "comprou"], ["near", "perto de"], ["because", "porque"], ["tired", "cansada"], ["any", "nenhum(a) / algum(a)"]], "tip": ""}, {"kind": "quiz", "title": "Detetive de leitura 1", "prompt": "Para onde Mia foi?", "choices": ["zoo", "airport", "stadium", "city center"], "correct": 3, "explanation": "Ela foi ao centro da cidade.", "topic": "Leitura"}, {"kind": "quiz", "title": "Detetive de leitura 2", "prompt": "Qual lugar a família visitou?", "choices": ["subway", "park", "museum", "school"], "correct": 2, "explanation": "They visited a museum.", "topic": "Leitura"}, {"kind": "quiz", "title": "Detetive de leitura 3", "prompt": "Onde compraram comida?", "choices": ["bus station", "market", "zoo", "stadium"], "correct": 1, "explanation": "They bought food at the market.", "topic": "Leitura"}, {"kind": "quiz", "title": "Detetive de leitura 4", "prompt": "O que havia perto do museu?", "choices": ["two stadiums", "a small square", "a zoo", "a bus station"], "correct": 1, "explanation": "There was a small square near the museum.", "topic": "Leitura"}, {"kind": "quiz", "title": "Detetive de leitura 5", "prompt": "Havia ônibus naquela rua?", "choices": ["No, there wasn’t.", "Yes, there were.", "No, there weren’t.", "Yes, there was."], "correct": 2, "explanation": "There weren’t any buses.", "topic": "Leitura"}, {"kind": "quiz", "title": "Detetive de leitura 6", "prompt": "Por que Mia não foi ao zoo?", "choices": ["She was excited.", "She was hungry.", "She was angry.", "She was tired."], "correct": 3, "explanation": "Because she was tired.", "topic": "Leitura"}, {"kind": "write", "title": "Relato curto • Meu passeio", "prompt": "Escreva de 3 a 5 frases em inglês sobre uma visita a uma cidade: inclua um lugar, uma ação no passado, “there was/were” e uma ação negativa.", "model": "Last weekend, I went to the city center. There was a museum. I visited the museum and saw paintings. I didn’t go to the zoo.", "topic": "Escrita"}, {"kind": "quiz", "title": "Memória de vocabulário 1", "prompt": "Qual é a tradução de <b>market</b>?", "choices": ["metrô", "praça", "mercado", "museu"], "correct": 2, "explanation": "market = mercado.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 2", "prompt": "Qual é a tradução de <b>zoo</b>?", "choices": ["estádio", "zoológico", "parque", "centro da cidade"], "correct": 1, "explanation": "zoo = zoológico.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 3", "prompt": "Qual é a tradução de <b>square</b>?", "choices": ["praça", "metrô", "estádio", "centro da cidade"], "correct": 0, "explanation": "square = praça.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 4", "prompt": "Qual é a tradução de <b>bus station</b>?", "choices": ["cinema", "rodoviária", "metrô", "rua"], "correct": 1, "explanation": "bus station = rodoviária.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 5", "prompt": "Qual é a tradução de <b>movie theater</b>?", "choices": ["zoológico", "parque", "museu", "cinema"], "correct": 3, "explanation": "movie theater = cinema.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 6", "prompt": "Qual é a tradução de <b>park</b>?", "choices": ["centro da cidade", "cinema", "estádio", "parque"], "correct": 3, "explanation": "park = parque.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 7", "prompt": "Qual é a tradução de <b>museum</b>?", "choices": ["rodoviária", "metrô", "museu", "centro da cidade"], "correct": 2, "explanation": "museum = museu.", "topic": "Vocabulário"}, {"kind": "quiz", "title": "Memória de vocabulário 8", "prompt": "Qual é a tradução de <b>stadium</b>?", "choices": ["metrô", "centro da cidade", "estádio", "praça"], "correct": 2, "explanation": "stadium = estádio.", "topic": "Vocabulário"}, {"kind": "write", "title": "Fechamento • Quatro frases", "prompt": "Escreva: (1) Havia um parque. (2) Não havia dois museus. (3) Fui ao mercado. (4) Não visitei o zoológico.", "model": "There was a park. There weren’t two museums. I went to the market. I didn’t visit the zoo.", "topic": "Escrita"}];const L=2;let idx=0,sec=0,paused=false,finished=false,answers={},marks={};const el=id=>document.getElementById(id);const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function count(){return Object.keys(marks).filter(k=>S[k].kind==='quiz'&&marks[k]).length}function draw(){finished=false;const s=S[idx];el('where').textContent='Página '+(idx+1)+' de '+S.length+' • '+(s.kind==='quiz'?'Exercício':s.kind==='write'?'Produção escrita':'Explicação');el('bar').style.width=(100*(idx+1)/S.length)+'%';el('back').disabled=idx===0;el('next').textContent=idx===S.length-1?'Resultado →':'Próxima →';el('score').textContent='⭐ '+count()*10+' pontos';let h='<h1>'+safe(s.title)+'</h1>';if(s.kind==='lesson'){h+=s.body;if(s.words?.length)h+='<h3>Vocabulário: toque para traduzir</h3><div class="words">'+s.words.map(w=>'<button class="word" onclick="this.classList.toggle(&quot;active&quot;)">'+safe(w[0])+' <small>· '+safe(w[1])+'</small></button>').join('')+'</div>';if(s.tip)h+='<div class="tip">💡 '+safe(s.tip)+'</div>'}else if(s.kind==='quiz'){h+='<p>'+s.prompt+'</p>'+s.choices.map((x,j)=>'<button class="choice '+(answers[idx]===j?'chosen':'')+'" onclick="choose('+j+')">'+String.fromCharCode(65+j)+'. '+safe(x)+'</button>').join('')+'<button class="primary" onclick="verify()">Conferir resposta</button><div id="feedback">'+(marks[idx]!==undefined?feedback():'')+'</div>'}else{h+='<p>'+s.prompt+'</p><textarea id="response" placeholder="Escreva aqui antes de conferir..." oninput="answers['+idx+']=this.value">'+safe(answers[idx]||'')+'</textarea><p><button class="secondary" onclick="model()">Mostrar modelo para comparar</button></p><div id="feedback">'+(marks[idx]!==undefined?'<div class="feedback">✍️ Modelo possível: '+safe(s.model)+'</div>':'')+'</div>'}el('screen').innerHTML=h}function choose(j){answers[idx]=j;draw()}function feedback(){const s=S[idx];return '<div class="feedback '+(marks[idx]?'':'bad')+'">'+(marks[idx]?'✅ Correto! ':'🔎 Resposta correta: <b>'+safe(s.choices[s.correct])+'</b>. ')+s.explanation+'</div>'}function verify(){if(answers[idx]===undefined){el('feedback').innerHTML='<div class="tip">Escolha uma alternativa.</div>';return}marks[idx]=answers[idx]===S[idx].correct;draw()}function model(){marks[idx]=true;draw()}function restart(){idx=0;el('next').style.display='inline-block';draw()}function summary(){finished=true;let total=S.filter(x=>x.kind==='quiz').length,answered=Object.keys(marks).filter(k=>S[k].kind==='quiz').length,right=count(),topics={};S.forEach((s,i)=>{if(s.kind==='quiz'){topics[s.topic]??=[0,0];topics[s.topic][1]++;if(marks[i])topics[s.topic][0]++}});el('where').textContent='Diagnóstico final';el('bar').style.width='100%';el('screen').innerHTML='<h1>🏅 Missão concluída!</h1><p><b>'+right+' de '+total+' questões corretas</b> ('+Math.round(100*right/total)+'%). Respondidas: '+answered+'/'+total+'.</p><p>⏱️ Tempo: '+el('clock').textContent+' · ⭐ '+right*10+' pontos</p><h2>Seu mapa de aprendizagem</h2>'+Object.entries(topics).map(([k,v])=>'<p><b>'+safe(k)+'</b>: '+v[0]+'/'+v[1]+'</p>').join('')+'<div class="tip">Releia as questões erradas e reescreva 5 palavras que confundiu. As tarefas de escrita são autocorrigidas pela comparação com o modelo, não entram no percentual.</div><button class="primary" onclick="restart()">Rever atividades</button>';el('next').style.display='none'}el('back').onclick=()=>{if(finished){finished=false;el('next').style.display='inline-block'}idx=Math.max(0,idx-1);draw()};el('next').onclick=()=>idx===S.length-1?summary():(idx++,draw());el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar'};setInterval(()=>{if(!paused&&!finished){sec++;el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000);document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')el('back').click();if(e.key==='ArrowRight')el('next').click()});draw();</script></body></html>
