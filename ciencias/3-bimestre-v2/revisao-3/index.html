template-columns:repeat(4,1fr);gap:8px}.mem{aspect-ratio:1.3;border:1px solid var(--line);border-radius:12px;background:var(--p);color:white;font-weight:800}.mem.open,.mem.done{background:white;color:var(--ink)}.word{font-size:2rem;letter-spacing:.18em;font-weight:900}.letters{display:flex;gap:5px;flex-wrap:wrap}.letters button{width:36px;height:36px;border:1px solid var(--line);background:white;border-radius:8px}.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:430px;margin:18px auto}.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:white;font-size:2rem;font-weight:900}.modal{position:fixed;inset:0;background:#18332ddd;z-index:50;display:none;place-items:center;padding:18px}.modal.on{display:grid}.mb{background:white;border-radius:20px;padding:22px;max-width:600px;width:100%}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.rc{background:#f2faf7;border-radius:13px;padding:12px}@media(max-width:600px){.memory{grid-template-columns:repeat(3,1fr)}.stats .time{display:none}}

<script>const Q=[{"type":"mc","topic":"Forças","q":"Uma força pode:","opts":["apenas colocar objetos parados em movimento","mudar o movimento ou deformar um corpo","apenas diminuir a velocidade","existir somente quando há contato"],"ans":1,"exp":"Forças podem alterar o movimento ou provocar deformações."},{"type":"mc","topic":"Forças","q":"Qual trio descreve corretamente um vetor de força?","opts":["massa, volume e peso","tempo, distância e velocidade","intensidade, direção e sentido","apoio, potência e resistência"],"ans":2,"exp":"Uma força vetorial tem intensidade, direção e sentido."},{"type":"mc","topic":"Forças","q":"Duas forças de 8 N e 5 N agem para a direita. A resultante vale:","opts":["3 N","13 N","40 N","0 N"],"ans":1,"exp":"Mesmo sentido: 8 + 5 = 13 N."},{"type":"mc","topic":"Forças","q":"Uma força de 20 N atua para a direita e outra de 12 N para a esquerda. A resultante é:","opts":["32 N para a direita","8 N para a esquerda","8 N para a direita","0 N"],"ans":2,"exp":"Sentidos opostos: 20 − 12 = 8 N, para o lado da maior força."},{"type":"mc","topic":"Forças","q":"Duas forças de 15 N agem em sentidos opostos. O que ocorre com a resultante?","opts":["vale 30 N","vale 15 N","vale 1 N","vale 0 N"],"ans":3,"exp":"Forças iguais e opostas se equilibram."},{"type":"mc","topic":"Forças","q":"Qual instrumento é usado para medir força?","opts":["termômetro","dinamômetro","cronômetro","proveta"],"ans":1,"exp":"O dinamômetro mede força; a unidade é o newton."},{"type":"mc","topic":"Forças","q":"A unidade de força é:","opts":["joule (J)","quilograma (kg)","newton (N)","metro (m)"],"ans":2,"exp":"A unidade de força é o newton, N."},{"type":"mc","topic":"Atrito","q":"Qual situação depende do atrito para funcionar bem?","opts":["caminhar sem escorregar","um objeto flutuar no espaço","medir a massa","a Lua orbitar a Terra"],"ans":0,"exp":"O atrito entre o calçado e o chão ajuda a caminhar."},{"type":"mc","topic":"Atrito","q":"Por que rodas costumam facilitar o transporte de uma carga?","opts":["porque eliminam a massa","porque o atrito rolante costuma ser menor que o de deslizamento","porque anulam a gravidade","porque aumentam o peso"],"ans":1,"exp":"Rolar geralmente oferece menos resistência que arrastar."},{"type":"tf","topic":"Atrito","q":"O atrito é sempre prejudicial e deve ser eliminado.","ans":false,"exp":"O atrito também é útil, por exemplo ao caminhar e frear."},{"type":"mc","topic":"Forças","q":"Uma maçã cai em direção ao chão principalmente por causa da:","opts":["força de atrito","força gravitacional","força potente","inércia"],"ans":1,"exp":"A gravidade atrai os corpos em direção à Terra."},{"type":"mc","topic":"Forças","q":"Massa e peso são a mesma coisa?","opts":["sim, sempre","não; massa e peso representam grandezas diferentes","sim, mas só na Terra","não; massa é medida em newtons"],"ans":1,"exp":"Massa e peso não são a mesma grandeza."},{"type":"mc","topic":"1ª Lei","q":"Quando um ônibus freia, o passageiro tende a ir para a frente. Isso ilustra:","opts":["trabalho","inércia","polia móvel","ação e reação"],"ans":1,"exp":"O corpo tende a manter o movimento que possuía."},{"type":"mc","topic":"1ª Lei","q":"Se a força resultante sobre um corpo é zero, ele:","opts":["obrigatoriamente para","obrigatoriamente acelera","pode permanecer parado ou manter velocidade constante","sempre muda de direção"],"ans":2,"exp":"É a ideia central da 1ª Lei."},{"type":"mc","topic":"1ª Lei","q":"Um livro está parado sobre a mesa. A melhor conclusão é:","opts":["nenhuma força age nele","a força resultante pode ser zero","a gravidade desapareceu","ele não possui massa"],"ans":1,"exp":"Forças podem agir e ainda assim se equilibrar."},{"type":"mc","topic":"1ª Lei","q":"Qual corpo apresenta maior inércia?","opts":["o de menor massa","o de maior massa","sempre o mais rápido","sempre o mais alto"],"ans":1,"exp":"Maior massa significa maior inércia."},{"type":"mc","topic":"1ª Lei","q":"O cinto de segurança é importante numa freada porque:","opts":["aumenta a massa","ajuda a impedir que o corpo continue avançando por inércia","elimina a gravidade","produz uma polia"],"ans":1,"exp":"O corpo tende a continuar em movimento."},{"type":"tf","topic":"1ª Lei","q":"Para manter um corpo em movimento retilíneo com velocidade constante, é obrigatória uma força resultante diferente de zero.","ans":false,"exp":"Sem resultante, ele pode manter velocidade constante."},{"type":"mc","topic":"2ª Lei","q":"Dois carrinhos têm a mesma massa. O que recebe maior força resultante terá:","opts":["menor aceleração","maior aceleração","a mesma aceleração sempre","massa menor"],"ans":1,"exp":"Com mesma massa, maior força resultante produz maior aceleração."},{"type":"mc","topic":"2ª Lei","q":"Aplicando a mesma força em dois carrinhos, qual tende a acelerar menos?","opts":["o de maior massa","o de menor massa","os dois sempre igual","o que tiver rodas"],"ans":0,"exp":"Com a mesma força, maior massa resulta em menor aceleração."},{"type":"num","topic":"2ª Lei","q":"Um corpo de 4 kg acelera a 3 m/s². Pela relação F = m × a, qual é a força resultante em N?","ans":"12","exp":"4 × 3 = 12 N."},{"type":"num","topic":"2ª Lei","q":"Uma força resultante de 20 N age sobre um corpo de 5 kg. Qual é a aceleração em m/s²?","ans":"4","exp":"a = F ÷ m = 20 ÷ 5 = 4 m/s²."},{"type":"num","topic":"2ª Lei","q":"Um corpo acelera a 2 m/s² sob uma força resultante de 14 N. Qual é sua massa em kg?","ans":"7","exp":"m = F ÷ a = 14 ÷ 2 = 7 kg."},{"type":"mc","topic":"2ª Lei","q":"Se a massa permanece igual e a força resultante dobra, a aceleração:","opts":["diminui pela metade","também dobra","vira zero","não muda"],"ans":1,"exp":"Pela relação F = m × a, com massa constante, força e aceleração variam juntas."},{"type":"mc","topic":"2ª Lei","q":"Se a força resultante permanece igual e a massa aumenta, a aceleração tende a:","opts":["aumentar","diminuir","ficar sempre igual","virar força"],"ans":1,"exp":"Com força constante, maior massa implica menor aceleração."},{"type":"mc","topic":"2ª Lei","q":"Qual fórmula representa a 2ª Lei de Newton?","opts":["F = m × a","T = F × d","P = m ÷ a","a = m × F"],"ans":0,"exp":"A relação é F = m × a."},{"type":"mc","topic":"3ª Lei","q":"Um balão solto expele ar para trás e se move para a frente. Isso exemplifica:","opts":["1ª Lei apenas","ação e reação","polia fixa","trabalho nulo"],"ans":1,"exp":"O ar é empurrado para um lado e o balão recebe força no sentido oposto."},{"type":"mc","topic":"3ª Lei","q":"As forças de ação e reação atuam:","opts":["no mesmo corpo","em corpos diferentes","somente quando há atrito","apenas em máquinas"],"ans":1,"exp":"Elas atuam em corpos diferentes."},{"type":"mc","topic":"3ª Lei","q":"Ação e reação possuem:","opts":["mesma intensidade e sentidos opostos","intensidades sempre diferentes","mesmo sentido","uma força real e outra imaginária"],"ans":0,"exp":"Formam um par de mesma intensidade e sentidos opostos."},{"type":"mc","topic":"3ª Lei","q":"Por que ação e reação não se anulam diretamente?","opts":["porque têm intensidades diferentes","porque agem em corpos diferentes","porque uma acontece depois","porque só uma é força"],"ans":1,"exp":"Como atuam em corpos diferentes, não se somam como forças no mesmo corpo."},{"type":"mc","topic":"3ª Lei","q":"Ao empurrar uma parede, você sente a parede empurrando sua mão. Isso é:","opts":["ação e reação","inércia sem força","polia móvel","trabalho sempre positivo"],"ans":0,"exp":"É um par de ação e reação."},{"type":"tf","topic":"3ª Lei","q":"Primeiro ocorre a ação e, alguns segundos depois, surge a reação.","ans":false,"exp":"Ação e reação aparecem simultaneamente."},{"type":"mc","topic":"Trabalho","q":"No conteúdo estudado, trabalho mecânico é calculado por:","opts":["Força × Deslocamento","Massa × Tempo","Força ÷ Massa","Deslocamento ÷ Tempo"],"ans":0,"exp":"Trabalho = Força × Deslocamento, no caso apresentado."},{"type":"num","topic":"Trabalho","q":"Uma força de 8 N desloca uma caixa 20 m na direção da força. Qual o trabalho em J?","ans":"160","exp":"8 × 20 = 160 J."},{"type":"num","topic":"Trabalho","q":"Uma força de 12 N desloca um objeto 5 m na direção da força. Qual o trabalho em J?","ans":"60","exp":"12 × 5 = 60 J."},{"type":"mc","topic":"Trabalho","q":"A unidade de trabalho é:","opts":["newton","joule","quilograma","metro por segundo"],"ans":1,"exp":"O trabalho é medido em joules, J."},{"type":"mc","topic":"Máquinas","q":"Uma máquina simples serve principalmente para:","opts":["facilitar a realização de uma tarefa","criar energia do nada","eliminar totalmente o trabalho","aumentar sempre a massa"],"ans":0,"exp":"Máquinas simples facilitam tarefas ao modificar como a força é aplicada."},{"type":"mc","topic":"Alavancas","q":"Quais são elementos de uma alavanca?","opts":["apoio, força potente e força resistente","massa, tempo e volume","ação, reação e aceleração","roda, parafuso e cunha"],"ans":0,"exp":"Esses são os elementos usados para descrever alavancas."},{"type":"mc","topic":"Alavancas","q":"Numa alavanca interfixa, fica no meio:","opts":["o apoio","a força potente","a força resistente","a massa"],"ans":0,"exp":"Interfixa: o ponto de apoio fica entre as forças."},{"type":"mc","topic":"Alavancas","q":"Numa alavanca interpotente, fica no meio:","opts":["o apoio","a força potente","a força resistente","a gravidade"],"ans":1,"exp":"Interpotente: a força potente fica entre apoio e resistência."},{"type":"mc","topic":"Alavancas","q":"Numa alavanca inter-resistente, fica no meio:","opts":["o apoio","a força potente","a força resistente","a direção"],"ans":2,"exp":"Inter-resistente: a resistência fica no meio."},{"type":"mc","topic":"Alavancas","q":"No braço humano, ao flexionar o antebraço, a articulação do cotovelo funciona como:","opts":["ponto de apoio","força resistente","polia fixa","cunha"],"ans":0,"exp":"O cotovelo funciona como apoio nessa alavanca corporal."},{"type":"mc","topic":"Alavancas","q":"No mesmo exemplo do braço, o bíceps fornece principalmente:","opts":["força potente","força resistente","ponto de apoio","gravidade zero"],"ans":0,"exp":"A contração do bíceps fornece a força potente."},{"type":"mc","topic":"Máquinas","q":"Uma rampa permite elevar uma carga com menor força porque:","opts":["aumenta o caminho percorrido","elimina o peso","reduz a massa","faz o trabalho desaparecer"],"ans":0,"exp":"O plano inclinado troca um caminho maior por uma força menor."},{"type":"mc","topic":"Máquinas","q":"Uma cunha pode ser entendida como:","opts":["dois planos inclinados unidos","uma alavanca interfixa","uma roda sem eixo","uma polia móvel"],"ans":0,"exp":"A cunha deriva do plano inclinado."},{"type":"mc","topic":"Máquinas","q":"Uma rosca pode ser entendida como:","opts":["um plano inclinado enrolado em torno de um eixo","uma polia fixa","uma alavanca sem apoio","uma força resultante"],"ans":0,"exp":"É a relação apresentada no conteúdo."},{"type":"mc","topic":"Polias","q":"A polia fixa é especialmente útil para:","opts":["mudar a direção da força aplicada","eliminar o peso da carga","aumentar a massa","criar trabalho"],"ans":0,"exp":"Ela permite, por exemplo, puxar para baixo para levantar a carga."},{"type":"mc","topic":"Polias","q":"Uma polia móvel ideal pode:","opts":["reduzir a força necessária","eliminar o deslocamento","dobrar a massa","anular a gravidade"],"ans":0,"exp":"A montagem móvel pode oferecer vantagem mecânica."},{"type":"mc","topic":"Polias","q":"Em associações ideais mostradas no conteúdo, mais segmentos sustentando a carga podem:","opts":["aumentar a força necessária","reduzir a força necessária","apagar a massa","impedir qualquer movimento"],"ans":1,"exp":"A associação de polias pode diminuir a força exigida."},{"type":"mc","topic":"Máquinas","q":"Qual trio pertence à família ligada ao plano inclinado?","opts":["rampa, cunha e rosca","polia, dinamômetro e cinto","inércia, massa e peso","ação, reação e atrito"],"ans":0,"exp":"Cunha e rosca derivam da ideia do plano inclinado."},{"type":"mc","topic":"Integração","q":"Uma caixa de 10 kg recebe 30 N para a direita e 10 N para a esquerda. A resultante é 20 N. Qual aceleração resulta?","opts":["1 m/s²","2 m/s²","3 m/s²","4 m/s²"],"ans":1,"exp":"a = 20 ÷ 10 = 2 m/s²."},{"type":"mc","topic":"Integração","q":"Um carrinho está em velocidade constante numa linha reta. A melhor hipótese é que:","opts":["a resultante seja zero","não exista gravidade","sua massa seja zero","a 3ª Lei deixou de existir"],"ans":0,"exp":"Velocidade constante é compatível com resultante zero."},{"type":"mc","topic":"Integração","q":"Qual situação combina corretamente lei e exemplo?","opts":["1ª Lei: passageiro tende a seguir numa freada","2ª Lei: ação e reação em corpos diferentes","3ª Lei: F = m × a","1ª Lei: polia móvel reduz força"],"ans":0,"exp":"A freada é um exemplo clássico de inércia."},{"type":"mc","topic":"Integração","q":"Uma pessoa puxa uma corda para baixo e uma carga sobe por uma polia fixa. A polia principalmente:","opts":["muda a direção da força","elimina o trabalho","anula a massa","produz aceleração sem força"],"ans":0,"exp":"A polia fixa muda a direção da aplicação."}];let S=[],p=0,score=0,A={},start=Date.now(),main=document.getElementById('main');const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sec(x){return '<section class="s">'+x+'</section>'}function divi(n,t,d){return sec('<div class="eye">SIMULADO '+n+'</div><h1>'+t+'</h1><p>'+d+'</p><div class="mission">🎯 Responda antes de procurar pistas. Aqui o cérebro joga como titular.</div>')}
function qv(q,i){let b=q.type==='mc'?'<div class="opts">'+q.opts.map((o,j)=>'<button class="opt" onclick="ans('+i+','+j+',this)">'+String.fromCharCode(65+j)+'. '+E(o)+'</button>').join('')+'</div>':q.type==='tf'?'<div class="opts"><button class="opt" onclick="ans('+i+',true,this)">Verdadeiro</button><button class="opt" onclick="ans('+i+',false,this)">Falso</button></div>':'<input class="num" id="n'+i+'" inputmode="decimal" placeholder="Resposta"><button class="check" onclick="anum('+i+')">Conferir</button>';return sec('<div class="eye">'+E(q.topic)+' • QUESTÃO '+(i+1)+'/54</div><div class="qt">'+E(q.q)+'</div>'+b+'<div class="fb" id="f'+i+'"></div>')}
S.push(sec('<div class="eye">MISSÃO FINAL</div><h1>54 questões + 3 minijogos 🧠⚙️</h1><div class="mission"><b>Revisão 3 é treino de prova.</b> Pouca explicação, muita decisão. São três blocos progressivos, com maioria de múltipla escolha, cálculos curtos e verdadeiro/falso.</div><p>Cada questão vale <b>2 pontos</b>. Entre os simulados entram pausas-jogo para mudar o ritmo sem sair de Ciências.</p>'),divi(1,'Aquecimento de prova','Questões 1 a 18: fundamentos e aplicação direta.'));Q.slice(0,18).forEach((q,i)=>S.push(qv(q,i)));
S.push(sec('<div class="eye">MINIJOGO • MEMÓRIA</div><h2>Memória das máquinas ⚙️</h2><p>Encontre os pares conceito ↔ função.</p><div class="game"><div class="memory" id="memory"></div><p id="ms"></p></div>'),divi(2,'Newton em ação','Questões 19 a 36: leis, cálculos e interpretação.'));Q.slice(18,36).forEach((q,i)=>S.push(qv(q,i+18)));
S.push(sec('<div class="eye">MINIJOGO • FORCA</div><h2>Forca de Newton 🎈</h2><p>Dica: propriedade que faz um corpo resistir a mudanças em seu estado de movimento.</p><div class="game"><div class="word" id="word"></div><div class="letters" id="letters"></div><p id="hs"></p></div>'),divi(3,'Misturou tudo!','Questões 37 a 54: máquinas simples e integração dos conteúdos.'));Q.slice(36).forEach((q,i)=>S.push(qv(q,i+36)));
S.push(sec('<div class="eye">MINIJOGO • JOGO DA VELHA QUIZ</div><h2>Você × Newton: O contra X</h2><p>Escolha uma casa. Acertou a pergunta, marca O. Errou, Newton marca X. Feche uma linha, coluna ou diagonal.</p><div class="game"><div class="ttt" id="ttt"></div><p id="ts">Escolha uma casa.</p></div>'),sec('<div class="eye">DIAGNÓSTICO FINAL</div><h1>Missão concluída 🏁</h1><div id="res"></div>'));main.innerHTML=S.join('');
function render(){document.querySelectorAll('.s').forEach((x,i)=>x.classList.toggle('on',i===p));pg.textContent='Tela '+(p+1)+'/'+S.length;bar.style.width=((p+1)/S.length*100)+'%';let x=document.querySelectorAll('.s')[p];if(x.querySelector('#memory'))memory();if(x.querySelector('#word'))hang();if(x.querySelector('#ttt'))ttt();if(x.querySelector('#res'))results()}
function go(d){p=Math.max(0,Math.min(S.length-1,p+d));render();scrollTo({top:0,behavior:'smooth'})}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
function mark(i,ok,el){if(i in A)return;A[i]=ok;if(ok)score+=2;sc.textContent=score;if(el)el.classList.add(ok?'good':'bad');document.getElementById('f'+i).innerHTML=(ok?'✅ <b>Acertou.</b> ':'❌ <b>Quase.</b> ')+E(Q[i].exp)}
function ans(i,v,e){mark(i,v===Q[i].ans,e)}function anum(i){mark(i,Number(document.getElementById('n'+i).value.replace(',','.'))===Number(Q[i].ans))}

let mr=0;function memory(){if(mr)return;mr=1;let P=[['Interfixa','apoio no meio'],['Polia fixa','muda a direção'],['Cunha','2 planos inclinados'],['Inércia','resiste à mudança'],['Dinamômetro','mede força'],['Joule','unidade de trabalho']],C=[];P.forEach((a,k)=>a.forEach(t=>C.push({k,t})));C.sort(()=>Math.random()-.5);let box=memoryEl=document.getElementById('memory'),first=null,lock=0,done=0;C.forEach(c=>{let b=document.createElement('button');b.className='mem';b.textContent='?';b.onclick=()=>{if(lock||b===first||b.classList.contains('done'))return;b.textContent=c.t;b.classList.add('open');b.dataset.k=c.k;if(!first)first=b;else{lock=1;if(first.dataset.k===b.dataset.k){first.classList.add('done');b.classList.add('done');done+=2;first=null;lock=0;if(done===C.length)ms.innerHTML='🏆 Todos os pares encontrados!'}else setTimeout(()=>{first.textContent=b.textContent='?';first.classList.remove('open');b.classList.remove('open');first=null;lock=0},650)}};box.appendChild(b)})}
