<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciências • 3º Bimestre • Revisão 1</title><style>
:root{--bg:#eef8f5;--ink:#16302b;--green:#0f8b6d;--green2:#35b68f;--blue:#2f80ed;--red:#e85d75;--gold:#f4b942;--card:#fff;--muted:#657a75}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#d9fff2,transparent 35%),var(--bg);color:var(--ink)}button,input{font:inherit}.app{max-width:980px;margin:auto;min-height:100vh;padding:14px}.top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:#fff;padding:12px 16px;border-radius:18px;box-shadow:0 8px 28px #0f5d4b18;position:sticky;top:8px;z-index:5}.brand b{display:block}.brand small{color:var(--muted)}.clock,.score{font-weight:800;background:#e9f8f3;padding:8px 12px;border-radius:12px}.progress{height:8px;background:#dce9e5;border-radius:99px;margin:12px 4px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));width:2%;transition:.35s}.slide{background:#fff;border-radius:24px;padding:28px;min-height:620px;box-shadow:0 16px 45px #16493d14;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}.kicker{font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--green)}h1{font-size:clamp(1.65rem,4vw,2.6rem);margin:.2em 0 .45em}p{font-size:1.12rem;line-height:1.58}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:99px;background:#edf7f4;color:#39625a;font-size:.82rem}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}.nav button,#restart,.check-vector,.check-balance{border:0;border-radius:14px;padding:12px 18px;font-weight:850;cursor:pointer}.prev{background:#dfe9e6}.next,#restart,.check-vector,.check-balance{background:var(--green);color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:#f3faf8;border:1px solid #d9eee7;border-radius:18px;padding:18px}.card b,.card span{display:block}.card span{margin-top:7px;color:#55706a}.tip,.fact,.mission,.formula{padding:15px 17px;border-radius:15px;background:#fff7df;border-left:5px solid var(--gold);margin:14px 0}.scene{background:linear-gradient(#effaff,#f8fffd);border-radius:20px;padding:10px;margin:15px 0}.scene svg{width:100%;max-height:250px}.obj{fill:#ffe5a8;stroke:#805d20;stroke-width:3}.arrow{stroke-width:8;stroke-linecap:round}.blue{stroke:var(--blue)}.red{stroke:var(--red)}.beam{fill:#caa46b;stroke:#72552f;stroke-width:3}.accent{fill:var(--green2)}.load{fill:#ffd7df;stroke:#8d3f51;stroke-width:3}.wheel{fill:#d9edf8;stroke:#3e667c;stroke-width:8}.rope{fill:none;stroke:#775f46;stroke-width:7}.ramp{fill:#dce7e4;stroke:#54716a;stroke-width:4}.prompt{font-weight:750}.options{display:grid;gap:10px;margin:16px 0}.option{border:2px solid #dbeae6;background:#fff;border-radius:16px;padding:15px;text-align:left;cursor:pointer;transition:.15s}.option:hover{transform:translateY(-2px);border-color:#86cbb7}.option.correct{background:#ddf7eb;border-color:#38a77e}.option.wrong{background:#ffe8ec;border-color:#e85d75}.option:disabled{cursor:default}.feedback{min-height:48px;padding:10px 0;font-weight:700}.hero{height:180px;position:relative;display:grid;place-items:center}.guide{font-size:5rem;animation:bob 2s ease-in-out infinite}.orbit{position:absolute;font-size:2.3rem;animation:orbit 5s linear infinite}.anim-ball{height:70px;position:relative;background:#f0faf7;border-radius:16px;overflow:hidden}.anim-ball span{position:absolute;font-size:2.5rem;animation:roll 3s ease-in-out infinite}.vector-lab .v{margin:12px 0;font-size:1.4rem;color:var(--blue);font-weight:900}.short{width:30%}.medium{width:55%}.long{width:85%}.builder{display:grid;gap:16px;background:#f3faf8;padding:20px;border-radius:18px}.builder input{width:100%}.dir{font-size:2rem;padding:8px 24px;margin-right:8px;border:2px solid #cfe5de;border-radius:12px;background:white}.dir.active{background:#dff6ee;border-color:var(--green)}.dynamometer{margin:20px auto;width:180px;border:5px solid #6a7c78;border-radius:28px;padding:20px;display:flex;justify-content:space-around;background:#eef5f3}.spring{writing-mode:vertical-rl;font-size:2rem}.hook{font-size:3rem}.balance,.bigread{font-size:1.5rem;font-weight:900;display:flex;justify-content:center;gap:18px;align-items:center;padding:25px;background:#f3faf8;border-radius:18px}.planet{height:160px;display:grid;place-items:center;position:relative}.planet span{font-size:6rem}.fall{position:absolute;font-size:2rem;animation:fall 2s ease-in infinite}.newton{text-align:center;font-size:2rem;background:#f3faf8;padding:20px;border-radius:20px}.bus{font-size:4rem;display:flex;justify-content:center;gap:0}.passenger{font-size:2rem;animation:lean 2s ease-in-out infinite}.carts,.skaters{display:flex;justify-content:space-around;align-items:center;font-size:2.5rem;padding:25px}.friction{text-align:center;font-size:4rem}.rough{font-size:1rem;letter-spacing:4px}.machine-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.machine-grid div{font-size:2.3rem;background:#f3faf8;padding:18px;border-radius:18px}.machine-grid b,.machine-grid span{display:block;font-size:1rem}.ramps{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ramps div{padding:25px;background:#f3faf8;border-radius:18px}.bossicon,.trophy{text-align:center;font-size:6rem;animation:bob 1.8s ease-in-out infinite}.map{display:grid;gap:10px}.map b{font-size:1.25rem;color:var(--green);margin-top:10px}.map span{padding-left:18px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.results div{text-align:center;background:#f3faf8;padding:22px;border-radius:18px}.results b,.results span{display:block}.results b{font-size:2rem}.diagnostic{margin:18px 0;display:grid;gap:8px}.diagrow{display:flex;justify-content:space-between;background:#f7faf9;padding:10px 14px;border-radius:10px}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes orbit{from{transform:rotate(0) translateX(95px) rotate(0)}to{transform:rotate(360deg) translateX(95px) rotate(-360deg)}}@keyframes roll{0%{left:5%}50%{left:85%;transform:rotate(360deg)}100%{left:5%;transform:rotate(720deg)}}@keyframes fall{0%{top:0;opacity:0}30%{opacity:1}100%{top:110px;opacity:0}}@keyframes lean{50%{transform:translateX(22px) rotate(10deg)}}
@media(max-width:680px){.app{padding:8px}.top{grid-template-columns:1fr auto}.score{display:none}.slide{padding:20px;min-height:650px}.cards{grid-template-columns:1fr}.results{grid-template-columns:1fr}.machine-grid,.ramps{grid-template-columns:1fr}.scene svg{min-height:180px}.brand small{display:none}}
</style></head><body><div class="app"><div class="top"><div class="brand"><b>Ciências • 3º Bimestre • Revisão 1</b><small>Forças e Máquinas Simples</small></div><div class="clock">⏱ <span id="clock">00:00</span> <button id="pause" title="Pausar">⏸</button></div><div class="score">⭐ <span id="score">0</span></div></div><div class="progress"><i id="bar"></i></div><main id="slide" class="slide"></main><div class="nav"><button class="prev" id="prev">← Anterior</button><b id="counter">1 / 53</b><button class="next" id="next">Próxima →</button></div></div><script>
const slides=[{"kind": "intro", "title": "Missão: Laboratório das Forças e Máquinas", "html": "<div class=\"hero\"><div class=\"orbit\">⚙️</div><div class=\"guide\">🔬</div></div><p>O laboratório ficou sem energia mecânica. Para religá-lo, você precisará dominar <b>forças</b>, entender as <b>Leis de Newton</b> e reconstruir as <b>máquinas simples</b>.</p><div class=\"mission\"><b>Objetivo:</b> aprender, testar, errar sem medo e vencer o Chefão final.</div>", "time": 40, "topic": "Geral"}, {"kind": "theory", "title": "Força: uma interação entre corpos", "html": "<p>Uma <b>força</b> aparece quando há interação entre corpos. Ela pode <b>empurrar</b>, <b>puxar</b>, alterar o movimento ou provocar deformação.</p><div class=\"cards\"><div class=\"card\"><b>Empurrar</b><span>mover um carrinho</span></div><div class=\"card\"><b>Puxar</b><span>abrir uma gaveta</span></div><div class=\"card\"><b>Deformar</b><span>apertar uma mola</span></div></div><div class=\"tip\">👀 Procure sempre: quem exerce a força e sobre qual corpo ela atua?</div>", "time": 55, "topic": "Forças"}, {"kind": "game", "title": "Jogo 1 • Caça às forças", "html": "<p class=\"prompt\">Qual situação mostra uma força sendo aplicada?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">Um livro parado sozinho na mesa</button><button class=\"option\" data-correct=\"true\">Uma mão empurrando uma caixa</button><button class=\"option\" data-correct=\"false\">Uma sombra no chão</button><button class=\"option\" data-correct=\"false\">Uma fotografia na parede</button></div><div class=\"feedback\" data-explain=\"Empurrar a caixa é uma interação capaz de alterar seu movimento.\"></div>", "time": 45, "topic": "Forças"}, {"kind": "theory", "title": "O que uma força pode fazer?", "html": "<p>Uma força pode produzir dois efeitos muito importantes:</p><div class=\"cards\"><div class=\"card\"><b>Movimento</b><span>iniciar, parar, acelerar, desacelerar ou mudar a direção</span></div><div class=\"card\"><b>Deformação</b><span>mudar a forma de um corpo, temporária ou permanentemente</span></div></div><div class=\"anim-ball\"><span>●</span></div><small>A bolinha se move porque uma força alterou seu estado de movimento.</small>", "time": 55, "topic": "Forças"}, {"kind": "interactive", "title": "Interação 1 • Antes e depois", "html": "<p class=\"prompt\">Uma bola vem rolando e você a chuta para o lado. O efeito principal da força foi…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">apenas mudar a cor</button><button class=\"option\" data-correct=\"true\">mudar a direção do movimento</button><button class=\"option\" data-correct=\"false\">diminuir a massa</button><button class=\"option\" data-correct=\"false\">eliminar a gravidade</button></div><div class=\"feedback\" data-explain=\"A força do chute altera a direção do movimento.\"></div>", "time": 45, "topic": "Forças"}, {"kind": "theory", "title": "Toda força tem características", "html": "<p>Para representar uma força, precisamos pensar em <b>intensidade</b>, <b>direção</b> e <b>sentido</b>.</p><div class=\"scene\"><svg viewBox=\"0 0 640 220\"><rect x=\"245\" y=\"105\" width=\"150\" height=\"80\" rx=\"12\" class=\"obj\"/><text x=\"320\" y=\"152\" text-anchor=\"middle\">CAIXA</text><line x1=\"245\" y1=\"145\" x2=\"90\" y2=\"145\" class=\"arrow blue\"/><polygon points=\"90,145 120,128 120,162\"/><line x1=\"395\" y1=\"145\" x2=\"550\" y2=\"145\" class=\"arrow red\"/><polygon points=\"550,145 520,128 520,162\"/><text x=\"120\" y=\"110\">força A</text><text x=\"485\" y=\"110\">força B</text></svg></div><div class=\"cards\"><div class=\"card\"><b>Intensidade</b><span>o “tamanho” da força</span></div><div class=\"card\"><b>Direção</b><span>horizontal, vertical ou inclinada</span></div><div class=\"card\"><b>Sentido</b><span>para qual lado da direção a força aponta</span></div></div>", "time": 65, "topic": "Forças"}, {"kind": "game", "title": "Jogo 2 • Arqueira dos vetores", "html": "<p class=\"prompt\">Uma caixa é empurrada horizontalmente para a direita. Qual vetor combina com isso?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">←</button><button class=\"option\" data-correct=\"false\">↑</button><button class=\"option\" data-correct=\"true\">→</button><button class=\"option\" data-correct=\"false\">↓</button></div><div class=\"feedback\" data-explain=\"Direção horizontal e sentido para a direita.\"></div>", "time": 40, "topic": "Forças"}, {"kind": "theory", "title": "A seta conta uma história", "html": "<p>O vetor é desenhado como uma <b>seta</b>. Sua orientação indica direção e sentido; seu comprimento pode representar a intensidade.</p><div class=\"vector-lab\"><div class=\"v short\">→ 2 N</div><div class=\"v medium\">→ 5 N</div><div class=\"v long\">→ 8 N</div></div><p>Quanto maior a força, maior pode ser a seta na representação.</p>", "time": 50, "topic": "Forças"}, {"kind": "interactive", "title": "Interação 2 • Monte o vetor", "html": "<p class=\"prompt\">Monte uma força de <b>6 N para a direita</b>.</p><div class=\"builder\"><label>Intensidade <input id=\"mag\" type=\"range\" min=\"1\" max=\"10\" value=\"3\"><output id=\"magout\">3 N</output></label><div><button class=\"dir\" data-dir=\"left\">←</button><button class=\"dir\" data-dir=\"right\">→</button></div><button class=\"check-vector\">Verificar</button></div><div class=\"feedback\"></div>", "time": 55, "topic": "Forças"}, {"kind": "theory", "title": "Dinamômetro: medindo forças", "html": "<div class=\"dynamometer\"><div class=\"scale\">0<br>1<br>2<br>3<br>4<br>5</div><div class=\"spring\">〰〰〰</div><div class=\"hook\">J</div></div><p>O <b>dinamômetro</b> mede a intensidade de uma força. A unidade usada é o <b>newton (N)</b>.</p><div class=\"fact\">O nome da unidade homenageia Isaac Newton.</div>", "time": 55, "topic": "Forças"}, {"kind": "game", "title": "Jogo 3 • Laboratório do dinamômetro", "html": "<p class=\"prompt\">Um dinamômetro marca 4 N. O número 4 representa…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">a massa em kg</button><button class=\"option\" data-correct=\"true\">a intensidade da força</button><button class=\"option\" data-correct=\"false\">o volume</button><button class=\"option\" data-correct=\"false\">a velocidade</button></div><div class=\"feedback\" data-explain=\"O dinamômetro mede força, e a unidade é newton (N).\"></div>", "time": 40, "topic": "Forças"}, {"kind": "exercise", "title": "Exercício 1", "html": "<p class=\"prompt\">Qual alternativa apresenta corretamente três características de uma força?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">massa, volume e cor</button><button class=\"option\" data-correct=\"true\">direção, sentido e intensidade</button><button class=\"option\" data-correct=\"false\">tempo, distância e temperatura</button><button class=\"option\" data-correct=\"false\">peso, altura e densidade</button></div><div class=\"feedback\" data-explain=\"Forças são descritas por direção, sentido e intensidade.\"></div>", "time": 45, "topic": "Forças"}, {"kind": "exercise", "title": "Exercício 2", "html": "<p class=\"prompt\">Qual instrumento é usado para medir forças?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">termômetro</button><button class=\"option\" data-correct=\"false\">balança de cozinha</button><button class=\"option\" data-correct=\"true\">dinamômetro</button><button class=\"option\" data-correct=\"false\">cronômetro</button></div><div class=\"feedback\" data-explain=\"O dinamômetro mede a intensidade das forças.\"></div>", "time": 40, "topic": "Forças"}, {"kind": "theory", "title": "Quando várias forças atuam juntas", "html": "<p>Forças que atuam sobre o mesmo corpo podem se combinar. Quando apontam no <b>mesmo sentido</b>, seus efeitos se somam. Quando apontam em <b>sentidos opostos</b>, um efeito reduz o outro.</p><div class=\"scene\"><svg viewBox=\"0 0 640 220\"><rect x=\"245\" y=\"105\" width=\"150\" height=\"80\" rx=\"12\" class=\"obj\"/><text x=\"320\" y=\"152\" text-anchor=\"middle\">CAIXA</text><line x1=\"245\" y1=\"145\" x2=\"90\" y2=\"145\" class=\"arrow blue\"/><polygon points=\"90,145 120,128 120,162\"/><line x1=\"395\" y1=\"145\" x2=\"550\" y2=\"145\" class=\"arrow red\"/><polygon points=\"550,145 520,128 520,162\"/><text x=\"120\" y=\"110\">força A</text><text x=\"485\" y=\"110\">força B</text></svg></div>", "time": 55, "topic": "Resultante"}, {"kind": "interactive", "title": "Interação 3 • Cabo de guerra", "html": "<p class=\"prompt\">Equipe A puxa com 300 N para a esquerda e equipe B com 200 N para a direita. Para onde tende o movimento?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">direita</button><button class=\"option\" data-correct=\"true\">esquerda</button><button class=\"option\" data-correct=\"false\">para cima</button><button class=\"option\" data-correct=\"false\">não há como saber</button></div><div class=\"feedback\" data-explain=\"A força maior está para a esquerda; a resultante é 100 N para a esquerda.\"></div>", "time": 50, "topic": "Resultante"}, {"kind": "theory", "title": "Força resultante", "html": "<p>A <b>força resultante</b> resume o efeito conjunto das forças.</p><div class=\"formula\">mesmo sentido: 4 N + 3 N = <b>7 N</b></div><div class=\"formula\">sentidos opostos: 7 N − 4 N = <b>3 N</b> no sentido da maior</div><p>Se forças opostas têm a mesma intensidade, a resultante pode ser <b>zero</b>.</p>", "time": 60, "topic": "Resultante"}, {"kind": "game", "title": "Jogo 4 • Arena da Resultante", "html": "<p class=\"prompt\">Duas forças horizontais atuam numa caixa: 8 N → e 3 N ←. Qual é a resultante?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">11 N →</button><button class=\"option\" data-correct=\"true\">5 N →</button><button class=\"option\" data-correct=\"false\">5 N ←</button><button class=\"option\" data-correct=\"false\">0 N</button></div><div class=\"feedback\" data-explain=\"8 − 3 = 5 N, no sentido da força de 8 N.\"></div>", "time": 45, "topic": "Resultante"}, {"kind": "theory", "title": "Equilíbrio de forças", "html": "<p>Quando a força resultante é <b>zero</b>, as forças estão equilibradas. Isso não significa necessariamente que não existam forças, mas que seus efeitos se compensam.</p><div class=\"balance\"><span>6 N →</span><b>📦</b><span>← 6 N</span></div>", "time": 50, "topic": "Resultante"}, {"kind": "interactive", "title": "Interação 4 • Equilibre a caixa", "html": "<p class=\"prompt\">À direita já existem <b>7 N</b>. Ajuste a força para a esquerda até equilibrar.</p><input id=\"balanceRange\" type=\"range\" min=\"1\" max=\"10\" value=\"3\"><div class=\"bigread\"><span id=\"balanceVal\">3</span> N ← 📦 → 7 N</div><button class=\"check-balance\">Equilibrar</button><div class=\"feedback\"></div>", "time": 55, "topic": "Resultante"}, {"kind": "exercise", "title": "Exercício 3", "html": "<p class=\"prompt\">10 N → e 10 N ← atuam sobre o mesmo objeto. A resultante é…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">20 N →</button><button class=\"option\" data-correct=\"false\">10 N ←</button><button class=\"option\" data-correct=\"true\">0 N</button><button class=\"option\" data-correct=\"false\">1 N</button></div><div class=\"feedback\" data-explain=\"Forças opostas de mesma intensidade se equilibram.\"></div>", "time": 40, "topic": "Resultante"}, {"kind": "theory", "title": "Massa, peso e gravidade", "html": "<p><b>Massa</b> está relacionada à quantidade de matéria de um corpo. <b>Peso</b> é uma força associada à atração gravitacional exercida sobre ele.</p><div class=\"planet\"><span>🌍</span><div class=\"fall\">🍎</div></div><p>A gravidade atrai os corpos. Por isso, peso é uma <b>força</b> e pode ser expresso em newtons.</p>", "time": 60, "topic": "Gravidade"}, {"kind": "game", "title": "Jogo 5 • Terra ou Lua?", "html": "<p class=\"prompt\">Se uma pessoa vai da Terra para a Lua, qual grandeza permanece a mesma?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">peso</button><button class=\"option\" data-correct=\"true\">massa</button><button class=\"option\" data-correct=\"false\">força gravitacional</button><button class=\"option\" data-correct=\"false\">aceleração da gravidade</button></div><div class=\"feedback\" data-explain=\"A massa permanece; o peso muda porque a gravidade é diferente.\"></div>", "time": 45, "topic": "Gravidade"}, {"kind": "interactive", "title": "Interação 5 • Massa ≠ peso", "html": "<p class=\"prompt\">Complete corretamente: “O peso de um corpo…”</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">é medido em newtons e depende da gravidade</button><button class=\"option\" data-correct=\"false\">é sempre igual à massa</button><button class=\"option\" data-correct=\"false\">é medido em litros</button><button class=\"option\" data-correct=\"false\">não é uma força</button></div><div class=\"feedback\" data-explain=\"Peso é força e depende da interação gravitacional.\"></div>", "time": 45, "topic": "Gravidade"}, {"kind": "theory", "title": "Newton e o movimento", "html": "<div class=\"newton\">🍎 <b>Isaac Newton</b> ⚙️</div><p>As Leis de Newton ajudam a explicar como forças se relacionam com o movimento. Vamos usá-las em situações do cotidiano, não apenas decorar nomes.</p>", "time": 45, "topic": "Newton"}, {"kind": "theory", "title": "1ª Lei • Inércia", "html": "<p>Um corpo tende a manter seu estado de <b>repouso</b> ou de <b>movimento</b>, a menos que uma força resultante altere esse estado.</p><div class=\"bus\"><span>🚌</span><span class=\"passenger\">🧍</span></div><p>Quando um ônibus freia de repente, o passageiro tende a continuar o movimento que tinha.</p>", "time": 60, "topic": "Newton"}, {"kind": "game", "title": "Jogo 6 • Passageiro teimoso", "html": "<p class=\"prompt\">Um ônibus em movimento freia bruscamente. O passageiro tende a…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">ir para a frente em relação ao ônibus</button><button class=\"option\" data-correct=\"false\">ser puxado para trás pela gravidade</button><button class=\"option\" data-correct=\"false\">perder massa</button><button class=\"option\" data-correct=\"false\">ficar imóvel em relação ao chão</button></div><div class=\"feedback\" data-explain=\"Pela inércia, o corpo tende a manter o movimento que possuía.\"></div>", "time": 45, "topic": "Newton"}, {"kind": "theory", "title": "2ª Lei • Força, massa e aceleração", "html": "<p>Quanto maior a força resultante aplicada a um corpo, maior pode ser a mudança em seu movimento. Para a <b>mesma força</b>, um corpo de menor massa tende a adquirir maior aceleração que um de maior massa.</p><div class=\"carts\"><span>🛒 leve</span><span>🛒 pesado</span></div>", "time": 60, "topic": "Newton"}, {"kind": "interactive", "title": "Interação 6 • Carrinhos na pista", "html": "<p class=\"prompt\">Dois carrinhos recebem a mesma força. Um tem 2 kg e outro 8 kg. Qual tende a acelerar mais?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">o de 8 kg</button><button class=\"option\" data-correct=\"true\">o de 2 kg</button><button class=\"option\" data-correct=\"false\">os dois sempre igual</button><button class=\"option\" data-correct=\"false\">nenhum</button></div><div class=\"feedback\" data-explain=\"Com a mesma força, o carrinho de menor massa tende a ter maior aceleração.\"></div>", "time": 45, "topic": "Newton"}, {"kind": "theory", "title": "3ª Lei • Ação e reação", "html": "<p>Quando um corpo exerce uma força sobre outro, o segundo exerce sobre o primeiro uma força de mesma intensidade e direção, mas de sentido oposto.</p><div class=\"skaters\"><span>⛸️</span><b>⇆</b><span>⛸️</span></div><p>Importante: ação e reação atuam em <b>corpos diferentes</b>.</p>", "time": 60, "topic": "Newton"}, {"kind": "game", "title": "Jogo 7 • Duplas inseparáveis", "html": "<p class=\"prompt\">Ao empurrar uma parede, qual é o par de ação e reação?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">sua mão empurra a parede e a parede empurra sua mão</button><button class=\"option\" data-correct=\"false\">sua mão empurra a parede duas vezes</button><button class=\"option\" data-correct=\"false\">a gravidade desaparece</button><button class=\"option\" data-correct=\"false\">a parede perde massa</button></div><div class=\"feedback\" data-explain=\"As duas forças formam um par e atuam em corpos diferentes.\"></div>", "time": 45, "topic": "Newton"}, {"kind": "exercise", "title": "Exercício 4", "html": "<p class=\"prompt\">A tendência de um corpo manter seu estado de movimento ou repouso é chamada…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">pressão</button><button class=\"option\" data-correct=\"true\">inércia</button><button class=\"option\" data-correct=\"false\">densidade</button><button class=\"option\" data-correct=\"false\">potência</button></div><div class=\"feedback\" data-explain=\"Inércia é o conceito central da 1ª Lei de Newton.\"></div>", "time": 40, "topic": "Newton"}, {"kind": "exercise", "title": "Exercício 5", "html": "<p class=\"prompt\">Ação e reação…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">atuam sempre no mesmo corpo</button><button class=\"option\" data-correct=\"true\">atuam em corpos diferentes e têm sentidos opostos</button><button class=\"option\" data-correct=\"false\">possuem intensidades obrigatoriamente diferentes</button><button class=\"option\" data-correct=\"false\">só existem quando o corpo está parado</button></div><div class=\"feedback\" data-explain=\"Na 3ª Lei, o par atua em corpos diferentes.\"></div>", "time": 40, "topic": "Newton"}, {"kind": "theory", "title": "Força de atrito", "html": "<p>O <b>atrito</b> aparece entre superfícies em contato e pode se opor ao deslizamento. Ele pode ser muito útil, por exemplo ao caminhar ou frear.</p><div class=\"friction\"><span>👟</span><div class=\"rough\">▰▰▰▰▰</div></div>", "time": 55, "topic": "Atrito"}, {"kind": "theory", "title": "Atrito: aliado ou obstáculo?", "html": "<div class=\"cards\"><div class=\"card\"><b>Ajuda</b><span>andar sem escorregar, frear, segurar objetos</span></div><div class=\"card\"><b>Pode atrapalhar</b><span>desgaste de peças, aquecimento, resistência ao movimento</span></div></div><p>Engenheiros podem aumentar ou reduzir o atrito conforme o objetivo.</p>", "time": 50, "topic": "Atrito"}, {"kind": "interactive", "title": "Interação 7 • Pista maluca", "html": "<p class=\"prompt\">Em qual superfície um objeto tende a encontrar MENOS atrito para deslizar?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">gelo liso</button><button class=\"option\" data-correct=\"false\">lixa áspera</button><button class=\"option\" data-correct=\"false\">asfalto rugoso</button><button class=\"option\" data-correct=\"false\">tapete grosso</button></div><div class=\"feedback\" data-explain=\"Uma superfície muito lisa, como gelo, costuma oferecer menor atrito ao deslizamento.\"></div>", "time": 45, "topic": "Atrito"}, {"kind": "game", "title": "Jogo 8 • Detetive do atrito", "html": "<p class=\"prompt\">Em qual situação o atrito é especialmente útil?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">pneu freando no asfalto</button><button class=\"option\" data-correct=\"false\">engrenagem sem lubrificação desgastando</button><button class=\"option\" data-correct=\"false\">arrastar um móvel pesado</button><button class=\"option\" data-correct=\"false\">peça superaquecendo</button></div><div class=\"feedback\" data-explain=\"O atrito entre pneu e chão ajuda na frenagem.\"></div>", "time": 45, "topic": "Atrito"}, {"kind": "theory", "title": "Máquinas simples", "html": "<p>Máquinas simples são dispositivos que podem <b>facilitar a realização de tarefas</b>, mudando a intensidade ou a direção da força necessária.</p><div class=\"cards\"><div class=\"card\"><b>Alavanca</b><span>barra que gira em torno de um apoio</span></div><div class=\"card\"><b>Roldana/polia</b><span>roda com sulco por onde passa uma corda</span></div><div class=\"card\"><b>Plano inclinado</b><span>superfície inclinada que facilita vencer uma altura</span></div></div>", "time": 65, "topic": "Máquinas"}, {"kind": "theory", "title": "Trabalho e vantagem mecânica", "html": "<p>Máquinas simples não “criam força do nada”. Elas organizam como aplicamos força e deslocamento para tornar uma tarefa mais conveniente.</p><div class=\"tip\">⚙️ Às vezes fazemos uma força menor ao longo de uma distância maior.</div>", "time": 50, "topic": "Máquinas"}, {"kind": "theory", "title": "Alavancas: três peças da ideia", "html": "<div class=\"scene\"><svg viewBox=\"0 0 640 220\"><polygon points=\"300,175 340,175 320,125\" class=\"accent\"/><rect x=\"110\" y=\"115\" width=\"420\" height=\"22\" rx=\"10\" class=\"beam\" transform=\"rotate(-5 320 126)\"/><circle cx=\"150\" cy=\"100\" r=\"38\" class=\"load\"/><text x=\"150\" y=\"105\" text-anchor=\"middle\">carga</text><path d=\"M500 60 v60\" class=\"arrow red\"/><polygon points=\"500,125 485,95 515,95\"/><text x=\"505\" y=\"50\">esforço</text></svg></div><div class=\"cards\"><div class=\"card\"><b>Ponto de apoio</b><span>região em torno da qual a alavanca gira</span></div><div class=\"card\"><b>Potência / esforço</b><span>força aplicada para realizar a tarefa</span></div><div class=\"card\"><b>Resistência / carga</b><span>o que queremos mover ou vencer</span></div></div>", "time": 65, "topic": "Máquinas"}, {"kind": "interactive", "title": "Interação 8 • Construa a alavanca", "html": "<p class=\"prompt\">Para facilitar levantar uma carga pesada com uma alavanca, qual estratégia costuma ajudar?</p><p class=\"prompt\">Escolha:</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">aproximar o ponto de apoio da carga</button><button class=\"option\" data-correct=\"false\">retirar o ponto de apoio</button><button class=\"option\" data-correct=\"false\">usar uma barra cada vez menor sem mudar nada</button><button class=\"option\" data-correct=\"false\">colocar a carga exatamente sobre sua mão</button></div><div class=\"feedback\" data-explain=\"Aproximar o apoio da carga pode aumentar a vantagem mecânica para o esforço aplicado.\"></div>", "time": 50, "topic": "Máquinas"}, {"kind": "game", "title": "Jogo 9 • Museu das alavancas", "html": "<p class=\"prompt\">Qual objeto funciona usando o princípio de uma alavanca?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">tesoura</button><button class=\"option\" data-correct=\"false\">lâmpada</button><button class=\"option\" data-correct=\"false\">ímã parado</button><button class=\"option\" data-correct=\"false\">copo</button></div><div class=\"feedback\" data-explain=\"A tesoura usa alavancas articuladas em torno de um ponto de apoio.\"></div>", "time": 45, "topic": "Máquinas"}, {"kind": "theory", "title": "Roldanas ou polias", "html": "<div class=\"scene\"><svg viewBox=\"0 0 640 240\"><line x1=\"180\" y1=\"30\" x2=\"460\" y2=\"30\" class=\"beam\"/><circle cx=\"320\" cy=\"90\" r=\"42\" class=\"wheel\"/><path d=\"M280 90 V190 M360 90 V205\" class=\"rope\"/><rect x=\"240\" y=\"175\" width=\"80\" height=\"50\" rx=\"8\" class=\"load\"/><text x=\"280\" y=\"207\" text-anchor=\"middle\">carga</text><path d=\"M360 205 v-65\" class=\"arrow red\"/><polygon points=\"360,135 345,165 375,165\"/></svg></div><p>Uma <b>polia fixa</b> pode mudar a direção da força. Sistemas com polias móveis podem reduzir a força necessária para erguer uma carga, embora seja preciso puxar mais corda.</p>", "time": 65, "topic": "Máquinas"}, {"kind": "interactive", "title": "Interação 9 • Oficina de polias", "html": "<p class=\"prompt\">Qual vantagem simples uma polia fixa pode oferecer?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">mudar a direção da força aplicada</button><button class=\"option\" data-correct=\"false\">eliminar totalmente o peso</button><button class=\"option\" data-correct=\"false\">aumentar a massa</button><button class=\"option\" data-correct=\"false\">fazer a gravidade parar</button></div><div class=\"feedback\" data-explain=\"Uma polia fixa pode permitir puxar para baixo para erguer uma carga.\"></div>", "time": 45, "topic": "Máquinas"}, {"kind": "theory", "title": "Plano inclinado", "html": "<div class=\"scene\"><svg viewBox=\"0 0 640 230\"><polygon points=\"100,190 520,190 520,60\" class=\"ramp\"/><rect x=\"300\" y=\"118\" width=\"90\" height=\"55\" rx=\"8\" class=\"obj\" transform=\"rotate(-17 345 145)\"/><path d=\"M330 115 L430 82\" class=\"arrow blue\"/><polygon points=\"438,79 405,76 415,102\"/><text x=\"250\" y=\"70\">plano inclinado</text></svg></div><p>O <b>plano inclinado</b> permite alcançar uma altura percorrendo uma distância maior. Isso pode reduzir a força necessária em comparação com erguer a carga verticalmente.</p>", "time": 60, "topic": "Máquinas"}, {"kind": "game", "title": "Jogo 10 • Entrega impossível", "html": "<p class=\"prompt\">Você precisa levar uma caixa pesada para a carroceria de um caminhão. Qual máquina simples é mais adequada?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">rampa / plano inclinado</button><button class=\"option\" data-correct=\"false\">termômetro</button><button class=\"option\" data-correct=\"false\">bússola</button><button class=\"option\" data-correct=\"false\">cronômetro</button></div><div class=\"feedback\" data-explain=\"A rampa é um plano inclinado e facilita elevar a carga.\"></div>", "time": 45, "topic": "Máquinas"}, {"kind": "interactive", "title": "Interação 10 • Rampa regulável", "html": "<p class=\"prompt\">Compare duas rampas que chegam à mesma altura. Qual tende a exigir menor força, desconsiderando outros efeitos?</p><div class=\"ramps\"><div>rampa A: curta e íngreme 📐</div><div>rampa B: longa e suave 📏</div></div><p class=\"prompt\">Escolha:</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"false\">rampa A</button><button class=\"option\" data-correct=\"true\">rampa B</button><button class=\"option\" data-correct=\"false\">as duas obrigatoriamente exigem a mesma força</button><button class=\"option\" data-correct=\"false\">nenhuma é plano inclinado</button></div><div class=\"feedback\" data-explain=\"Uma rampa mais longa e menos inclinada pode reduzir a força necessária, em troca de maior distância.\"></div>", "time": 50, "topic": "Máquinas"}, {"kind": "theory", "title": "Máquinas no cotidiano", "html": "<div class=\"machine-grid\"><div>✂️<b>Tesoura</b><span>alavanca</span></div><div>🛒<b>Carrinho de mão</b><span>alavanca</span></div><div>🏗️<b>Içamento</b><span>polias</span></div><div>♿<b>Rampa</b><span>plano inclinado</span></div></div><p>Reconhecer a máquina simples escondida em objetos reais é uma ótima forma de revisar.</p>", "time": 55, "topic": "Máquinas"}, {"kind": "exercise", "title": "Exercício 6", "html": "<p class=\"prompt\">Uma polia fixa é especialmente útil porque pode…</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">mudar a direção da força</button><button class=\"option\" data-correct=\"false\">eliminar a massa da carga</button><button class=\"option\" data-correct=\"false\">criar energia</button><button class=\"option\" data-correct=\"false\">anular todas as forças</button></div><div class=\"feedback\" data-explain=\"A polia fixa muda a direção da força aplicada.\"></div>", "time": 40, "topic": "Máquinas"}, {"kind": "exercise", "title": "Exercício 7", "html": "<p class=\"prompt\">Qual alternativa contém apenas exemplos ligados a máquinas simples estudadas?</p><div class=\"options\" data-points=\"10\"><button class=\"option\" data-correct=\"true\">rampa, alavanca e polia</button><button class=\"option\" data-correct=\"false\">termômetro, régua e relógio</button><button class=\"option\" data-correct=\"false\">ímã, pilha e lâmpada</button><button class=\"option\" data-correct=\"false\">copo, prato e garrafa</button></div><div class=\"feedback\" data-explain=\"Rampa, alavanca e polia correspondem aos três grupos trabalhados.\"></div>", "time": 40, "topic": "Máquinas"}, {"kind": "boss", "title": "CHEFÃO • A máquina de Newton", "html": "<div class=\"bossicon\">🤖⚙️</div><p>O robô do laboratório travou uma caixa de suprimentos no alto. Você precisa combinar tudo o que aprendeu.</p><p class=\"prompt\">A caixa deve subir por uma rampa e depois ser erguida. Qual combinação faz mais sentido?</p><div class=\"options\" data-points=\"20\"><button class=\"option\" data-correct=\"true\">plano inclinado + polia</button><button class=\"option\" data-correct=\"false\">termômetro + cronômetro</button><button class=\"option\" data-correct=\"false\">apenas gravidade</button><button class=\"option\" data-correct=\"false\">massa + volume</button></div><div class=\"feedback\" data-explain=\"Plano inclinado e polia são máquinas simples adequadas para essas tarefas.\"></div>", "time": 60, "topic": "Integração"}, {"kind": "exercise", "title": "Exercício 8 • Sem ajuda", "html": "<p class=\"prompt\">Uma caixa recebe 12 N → e 5 N ←. Qual é a força resultante?</p><div class=\"options\" data-points=\"20\"><button class=\"option\" data-correct=\"false\">17 N →</button><button class=\"option\" data-correct=\"true\">7 N →</button><button class=\"option\" data-correct=\"false\">7 N ←</button><button class=\"option\" data-correct=\"false\">0 N</button></div><div class=\"feedback\" data-explain=\"12 − 5 = 7 N para a direita.\"></div>", "time": 45, "topic": "Resultante"}, {"kind": "theory", "title": "Mapa final", "html": "<div class=\"map\"><b>FORÇAS</b><span>→ direção • sentido • intensidade</span><span>→ resultante e equilíbrio</span><b>NEWTON</b><span>→ inércia • força/massa/aceleração • ação/reação</span><b>ATRITO</b><span>→ pode ajudar ou dificultar</span><b>MÁQUINAS SIMPLES</b><span>→ alavanca • polia • plano inclinado</span></div>", "time": 45, "topic": "Geral"}, {"kind": "result", "title": "Laboratório reativado!", "html": "<div class=\"trophy\">🏆</div><h3 id=\"finalTitle\">Missão concluída</h3><div class=\"results\"><div><b id=\"scoreOut\">0</b><span>pontos</span></div><div><b id=\"pctOut\">0%</b><span>acertos</span></div><div><b id=\"timeOut\">00:00</b><span>tempo</span></div></div><div id=\"diagnostic\" class=\"diagnostic\"></div><button id=\"restart\">Refazer jornada</button>", "time": 30, "topic": "Geral"}];let idx=0,score=0,seconds=0,paused=false,answers=0,hits=0,selectedDir=null;const topic={};
const el=id=>document.getElementById(id);setInterval(()=>{if(!paused){seconds++;el('clock').textContent=fmt(seconds)}},1000);function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'▶':'⏸'};
function render(){const x=slides[idx];el('slide').innerHTML=`<div class="kicker">${x.kind==='theory'?'Aprender':x.kind==='game'?'Jogo':x.kind==='interactive'?'Interação':x.kind==='exercise'?'Exercício':x.kind==='boss'?'Desafio final':'Missão'}</div><h1>${x.title}</h1><div class="meta"><span class="pill">⏳ ${x.time}s sugeridos</span><span class="pill">${x.topic}</span></div>${x.html}`;el('counter').textContent=`${idx+1} / ${slides.length}`;el('bar').style.width=((idx+1)/slides.length*100)+'%';el('prev').disabled=idx===0;el('next').textContent=idx===slides.length-1?'Concluir':'Próxima →';bind();if(x.kind==='result')finish()}
function bind(){document.querySelectorAll('.options').forEach(group=>group.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{if(group.dataset.done)return;group.dataset.done='1';answers++;const ok=btn.dataset.correct==='true';if(ok){hits++;const p=+(group.dataset.points||10);score+=p;el('score').textContent=score;btn.classList.add('correct')}else{btn.classList.add('wrong');group.querySelector('[data-correct="true"]').classList.add('correct')}group.querySelectorAll('button').forEach(b=>b.disabled=true);const fb=group.nextElementSibling;fb.textContent=(ok?'✓ Acertou! ':'↻ Quase! ')+(fb?.dataset.explain||'');const t=slides[idx].topic;topic[t]??={h:0,a:0};topic[t].a++;if(ok)topic[t].h++;}));const mag=el('mag');if(mag){mag.oninput=()=>el('magout').textContent=mag.value+' N';document.querySelectorAll('.dir').forEach(b=>b.onclick=()=>{selectedDir=b.dataset.dir;document.querySelectorAll('.dir').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('.check-vector').onclick=()=>{const ok=mag.value==='6'&&selectedDir==='right';manual(ok,'Forças','Perfeito: 6 N, direção horizontal, sentido para a direita.','Ajuste a intensidade para 6 N e escolha →.')}}const br=el('balanceRange');if(br){br.oninput=()=>el('balanceVal').textContent=br.value;document.querySelector('.check-balance').onclick=()=>manual(br.value==='7','Resultante','Equilíbrio! 7 N em sentidos opostos produzem resultante zero.','Para equilibrar, as intensidades opostas precisam ser iguais.')}}
function manual(ok,t,yes,no){const fb=document.querySelector('.feedback');if(fb.dataset.done)return;fb.dataset.done='1';answers++;topic[t]??={h:0,a:0};topic[t].a++;if(ok){hits++;score+=10;topic[t].h++;el('score').textContent=score;fb.textContent='✓ '+yes}else fb.textContent='↻ '+no}
function finish(){el('scoreOut').textContent=score;el('pctOut').textContent=(answers?Math.round(hits/answers*100):0)+'%';el('timeOut').textContent=fmt(seconds);let rows='';Object.entries(topic).forEach(([k,v])=>rows+=`<div class="diagrow"><span>${k}</span><b>${v.h}/${v.a}</b></div>`);el('diagnostic').innerHTML='<h3>Diagnóstico por assunto</h3>'+rows;const pct=answers?hits/answers:0;el('finalTitle').textContent=pct>=.85?'Excelente domínio da missão!':pct>=.65?'Boa missão. Revise os pontos marcados.':'Missão completa. Vale reforçar os tópicos com menos acertos.';el('restart').onclick=()=>{idx=0;score=0;seconds=0;answers=0;hits=0;for(const k in topic)delete topic[k];el('score').textContent=0;render()}}
el('prev').onclick=()=>{if(idx>0){idx--;render();scrollTo(0,0)}};el('next').onclick=()=>{if(idx<slides.length-1){idx++;render();scrollTo(0,0)}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx<slides.length-1){idx++;render()}if(e.key==='ArrowLeft'&&idx>0){idx--;render()}});render();
</script></body></html>
