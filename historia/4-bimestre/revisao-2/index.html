<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>História • 4º bimestre • Revisão 2</title><style>:root{font-family:system-ui,sans-serif;color:#243049;background:#eef2f9}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fff;padding:12px 18px;border-bottom:1px solid #dce2f0;z-index:4}header a{color:#5544a9;font-weight:800}main{max-width:850px;margin:25px auto;padding:0 16px 100px}.panel{background:white;border:1px solid #dce2f0;border-radius:24px;padding:27px;box-shadow:0 12px 35px #263c6312}.eyebrow{font-weight:900;color:#6a4ab3;letter-spacing:.05em;text-transform:uppercase;font-size:.83rem}h1{font-size:clamp(2rem,5vw,3rem)}h2{font-size:clamp(1.5rem,3vw,2.1rem)}p{line-height:1.75}.lesson{background:#f0ecff;border-left:5px solid #7c63d9;padding:16px 18px;border-radius:13px;margin:18px 0;line-height:1.7}.options{display:grid;gap:10px;margin:20px 0}.options button{background:#fff;border:2px solid #d8deeb;border-radius:14px;padding:15px;text-align:left;font:inherit;color:inherit;cursor:pointer;line-height:1.5}.options button:hover{border-color:#8064da}.options button:disabled{cursor:default}.options button.good{background:#e7f8ee;border-color:#17804a}.options button.bad{background:#fff0f0;border-color:#be3434}.feedback{background:#f6f8ff;padding:16px;border-radius:14px}.feedback strong{color:#30446b}.bar{height:7px;background:#e2e7f2;margin-top:10px;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#7156d7;transition:.2s}.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:800;color:#56637a}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.nav button,.primary{border:0;background:#5b47bb;color:#fff;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.pill{display:inline-block;border-radius:99px;background:#ece8ff;padding:7px 12px;font-size:.82rem;font-weight:900;color:#5742a4}.pill.hard{background:#ffe7dd;color:#983f21}.pill.mid{background:#fff3d7;color:#80571d}.result-row{padding:11px 0;border-bottom:1px solid #e3e8f0}.source{font-size:.82rem;color:#68738a}.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px}.guide>div{padding:15px;background:#f6f7fd;border-radius:13px}@media(max-width:600px){.panel{padding:19px}.guide{grid-template-columns:1fr}.meta{gap:8px}.nav button{padding:11px}}</style></head><body><header><a href="../../../index.html">← Home School</a><div class="meta"><span id="count"></span><span id="score"></span><span id="clock"></span><button id="pause" type="button">Pausar</button></div><div class="bar"><div id="bar"></div></div></header><main><div class="panel" id="screen"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Próxima →</button></div></main><script>const Q=[{"topic":"Tordesilhas e disputa","lesson":"O acordo de 1494 envolvia Portugal e Espanha; não era aceito automaticamente por outras monarquias europeias.","q":"Qual conclusão explica melhor a presença francesa no litoral?","a":["O acordo vinculava Portugal e Espanha, mas não impedia automaticamente projetos franceses.","O acordo autorizava a França a administrar a faixa portuguesa.","O acordo dividia a América igualmente entre França e Portugal.","O acordo proibia qualquer comércio indígena com europeus."],"ok":0,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Pau-brasil e alianças","lesson":"Franceses buscaram pau-brasil e estabeleceram trocas e alianças com povos indígenas; as relações variaram conforme os grupos e interesses.","q":"Qual descrição evita simplificação?","a":["Os indígenas negociavam sempre sob ordens portuguesas.","Todos os povos indígenas fizeram aliança com franceses.","Houve alianças e trocas entre grupos com interesses próprios.","A França dominou imediatamente toda a costa brasileira."],"ok":2,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"França Antártica","lesson":"A ocupação francesa na Guanabara começou em 1555; a expulsão portuguesa se consolidou em 1567.","q":"Qual sequência está correta?","a":["Expulsão em 1555 e fundação em 1567.","Instalação em 1555 e expulsão em 1567.","Instalação em 1612 e expulsão em 1615.","Instalação em 1624 e expulsão em 1654."],"ok":1,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Tamoios e Guanabara","lesson":"Na disputa da Guanabara, alianças entre europeus e diferentes povos indígenas foram importantes. Os indígenas tinham interesses e conflitos próprios.","q":"Qual interpretação é mais adequada?","a":["Os povos indígenas foram apenas observadores.","Os portugueses e franceses formaram uma frente única.","Os conflitos foram decididos somente por armas europeias.","Alianças indígenas influenciaram a disputa, sem apagar sua autonomia."],"ok":3,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"França Equinocial","lesson":"O projeto francês no Maranhão iniciou-se em 1612 e foi derrotado em 1615; São Luís está ligado a esse processo.","q":"Qual associação está correta?","a":["França Equinocial, Maranhão, 1612–1615.","França Equinocial, Guanabara, 1555–1567.","França Antártica, Maranhão, 1612–1615.","França Antártica, Pernambuco, 1630–1654."],"ok":0,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Comparação das ocupações francesas","lesson":"França Antártica e França Equinocial foram projetos diferentes em épocas e regiões distintas.","q":"O que distingue corretamente as experiências?","a":["A Antártica ocorreu no Maranhão; a Equinocial, na Guanabara.","Ambas começaram durante o governo de Nassau.","A Antártica ocorreu na Guanabara; a Equinocial, no Maranhão.","Ambas se limitaram à região de Pernambuco."],"ok":2,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"União Ibérica","lesson":"De 1580 a 1640, Portugal e Espanha tiveram o mesmo monarca, sem se tornarem simplesmente um único território homogêneo.","q":"Qual formulação é historicamente mais precisa?","a":["Portugal deixou de existir e foi anexado integralmente.","As duas coroas passaram a compartilhar o monarca.","A Holanda passou a governar a Coroa portuguesa.","Portugal rompeu todas as relações comerciais atlânticas."],"ok":1,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Holanda e açúcar","lesson":"Conflitos europeus e interesses no comércio do açúcar ajudam a explicar as ofensivas holandesas contra possessões portuguesas.","q":"Qual relação causal é mais forte?","a":["O açúcar perdeu valor e motivou a retirada holandesa.","A Holanda buscava substituir o açúcar por café.","As invasões visavam apenas conquistar metais preciosos.","A disputa europeia somou-se ao interesse de controlar circuitos açucareiros."],"ok":3,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Salvador 1624","lesson":"Os holandeses ocuparam Salvador em 1624, mas foram expulsos em 1625 por uma força luso-espanhola.","q":"Qual afirmação respeita a cronologia?","a":["A primeira ocupação holandesa de Salvador foi breve, entre 1624 e 1625.","Salvador permaneceu sob domínio holandês até 1654.","Salvador foi ocupada apenas depois da Insurreição Pernambucana.","A tomada de Salvador aconteceu em 1637, sob Nassau."],"ok":0,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Pernambuco 1630","lesson":"A ocupação de Pernambuco iniciada em 1630 durou mais do que a tentativa em Salvador e se vinculou ao complexo açucareiro.","q":"Qual contraste está correto?","a":["Pernambuco foi ocupada em 1624; Salvador em 1630.","Ambas foram ocupadas apenas em 1645.","Salvador teve ocupação breve; Pernambuco, presença holandesa prolongada.","Salvador foi o centro das obras de Nassau entre 1637 e 1644."],"ok":2,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Companhia das Índias Ocidentais","lesson":"Criada em 1621, a Companhia das Índias Ocidentais articulava comércio, guerra e colonização no Atlântico.","q":"Qual caracterização é melhor?","a":["Era um grupo de jesuítas encarregado da catequese.","Era uma companhia mercantil com interesses econômicos e militares.","Era um conselho indígena de resistência aos franceses.","Era um órgão português dedicado exclusivamente à pecuária."],"ok":1,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Nassau e urbanização","lesson":"No período de Maurício de Nassau (1637–1644), Recife passou por obras urbanas e atividades artísticas e científicas.","q":"Qual alternativa apresenta ação ligada ao período?","a":["Fundação da França Antártica.","Criação do Tratado de Tordesilhas.","Início da União Ibérica.","Construção de pontes e incentivo a registros da natureza."],"ok":3,"level":"Fundamentos","block":"Capítulo 13"},{"topic":"Imagens de Frans Post","lesson":"Pinturas de Frans Post registram paisagens do Brasil holandês, mas são representações produzidas em contexto colonial.","q":"Como interpretar essas obras?","a":["Como fontes históricas que exigem atenção ao olhar de quem as produziu.","Como fotografias neutras e sem escolhas do artista.","Como relatos indígenas escritos diretamente pelos retratados.","Como provas de que não existia escravidão na colônia."],"ok":0,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Albert Eckhout","lesson":"Eckhout retratou pessoas e elementos naturais durante a ocupação holandesa; suas pinturas expressam escolhas de representação.","q":"Qual leitura crítica é adequada?","a":["As pinturas substituem todas as demais fontes históricas.","Os retratos mostram exatamente a opinião dos retratados.","As obras informam sobre a época, mas também revelam perspectivas do artista.","As imagens foram feitas antes da chegada europeia."],"ok":2,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Açúcar e trabalho escravizado","lesson":"A produção açucareira colonial dependia intensamente do trabalho escravizado de africanos e seus descendentes, além de outras formas de trabalho.","q":"Qual análise é mais precisa?","a":["O trabalho era inteiramente livre nos engenhos.","O açúcar articulava exploração do trabalho e redes atlânticas de comércio.","A economia açucareira não dependia de transporte marítimo.","Os engenhos existiam apenas nas cidades holandesas."],"ok":1,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Holandeses na África","lesson":"O controle de entrepostos e territórios africanos era estratégico para os holandeses também por causa do tráfico atlântico de pessoas escravizadas.","q":"Qual conexão explica essa estratégia?","a":["A Holanda pretendia encerrar imediatamente o tráfico.","O objetivo era criar fazendas de café na África.","As invasões africanas não tinham relação com o Brasil.","O abastecimento de mão de obra escravizada integrava a economia atlântica."],"ok":3,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Insurreição Pernambucana","lesson":"A resistência contra o domínio holandês se intensificou a partir de 1645, envolvendo diferentes grupos sociais.","q":"Qual formulação evita generalização?","a":["A resistência reuniu grupos diversos, com interesses nem sempre idênticos.","A resistência foi formada apenas por funcionários portugueses.","Todos os habitantes de Pernambuco apoiavam os holandeses.","A resistência começou somente após a expulsão em 1654."],"ok":0,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Guararapes","lesson":"As Batalhas dos Guararapes ocorreram em 1648 e 1649 e fazem parte da Insurreição Pernambucana.","q":"Qual cronologia está correta?","a":["Guararapes em 1630 e 1637; expulsão em 1645.","Guararapes em 1555 e 1567; expulsão em 1615.","Guararapes em 1648 e 1649; expulsão em 1654.","Guararapes em 1654 e 1660; expulsão em 1680."],"ok":2,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Expulsão holandesa","lesson":"A expulsão dos holandeses de Pernambuco ocorreu em 1654, depois de anos de conflitos.","q":"Qual evento marca o encerramento da ocupação?","a":["A fundação de São Luís em 1612.","A rendição holandesa em Pernambuco em 1654.","A chegada de Nassau em 1637.","A União Ibérica em 1580."],"ok":1,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Linha do tempo comparada","lesson":"França Antártica (1555), União Ibérica (1580), França Equinocial (1612), Salvador (1624) e Pernambuco (1630) são marcos diferentes.","q":"Qual sequência é cronologicamente correta?","a":["União Ibérica, França Antártica, Salvador, França Equinocial.","França Equinocial, França Antártica, União Ibérica, Pernambuco.","Salvador, França Equinocial, União Ibérica, Pernambuco.","França Antártica, União Ibérica, França Equinocial, Salvador."],"ok":3,"level":"Interpretação","block":"Capítulo 13"},{"topic":"Entradas e bandeiras","lesson":"Entradas eram geralmente organizadas pelo poder colonial; bandeiras, em geral, por particulares. Ambas podiam explorar o interior.","q":"Qual distinção é mais adequada?","a":["O tipo de organização, pública ou particular, ajuda a diferenciá-las.","Entradas eram sempre pacíficas; bandeiras sempre científicas.","Entradas só existiam no litoral; bandeiras só no oceano.","Bandeiras eram expedições francesas; entradas, holandesas."],"ok":0,"level":"Interpretação","block":"Capítulo 14"},{"topic":"São Vicente e bandeirismo","lesson":"Dificuldades econômicas em São Vicente e interesses de colonos contribuíram para expedições ao interior.","q":"Qual relação é historicamente defensável?","a":["A riqueza do café industrial estimulou bandeiras no século XVI.","As bandeiras surgiram para impedir toda ocupação do interior.","Condições econômicas locais ajudaram a impulsionar expedições e apresamento.","A União Ibérica proibiu definitivamente as expedições particulares."],"ok":2,"level":"Interpretação","block":"Capítulo 14"},{"topic":"Apresamento indígena","lesson":"Diversas bandeiras capturaram indígenas para escravização, enfrentando resistência de povos e comunidades.","q":"Qual descrição é mais responsável?","a":["O apresamento foi uma forma de trabalho assalariado voluntário.","O apresamento envolvia violência e privação de liberdade.","O apresamento era sempre negociado em igualdade de condições.","O apresamento foi praticado apenas por holandeses."],"ok":1,"level":"Interpretação","block":"Capítulo 14"},{"topic":"Missões jesuíticas","lesson":"Missões reuniam indígenas para catequização e reorganização da vida comunitária; bandeirantes atacaram várias dessas comunidades.","q":"Por que algumas missões eram alvo de bandeiras?","a":["Porque todas as missões eram fortalezas francesas.","Porque abrigavam minas holandesas.","Porque os jesuítas controlavam o comércio de açúcar europeu.","Porque concentravam populações indígenas que podiam ser capturadas."],"ok":3,"level":"Interpretação","block":"Capítulo 14"},{"topic":"Agência indígena","lesson":"Os indígenas resistiram de modos variados: fugas, guerras, alianças, negociações e manutenção de tradições.","q":"Qual ideia melhor expressa agência indígena?","a":["Povos indígenas fizeram escolhas e resistiram de formas diversas.","Os indígenas sempre agiram como um grupo político único.","A resistência indígena só ocorreu após a Independência.","Não existiram alianças ou negociações indígenas."],"ok":0,"level":"Interpretação","block":"Capítulo 14"},{"topic":"Sertanismo de contrato","lesson":"Algumas expedições eram contratadas para combater grupos indígenas ou quilombos, entre outros serviços.","q":"O que diferencia o sertanismo de contrato?","a":["Era uma viagem exclusivamente científica.","Era um tratado diplomático com a França.","Era uma expedição remunerada para cumprir tarefas contratadas.","Era uma rota de tropeiros apenas para vender animais."],"ok":2,"level":"Interpretação","block":"Capítulo 14"},{"topic":"Metais preciosos e interior","lesson":"A busca por ouro e pedras preciosas tornou-se um incentivo importante à penetração colonial no interior.","q":"Qual comparação é correta?","a":["O ouro foi a única finalidade de todas as bandeiras.","Apresamento e busca mineral foram objetivos diferentes em momentos e expedições.","A busca por metais ocorreu apenas na costa açucareira.","A mineração começou com a França Equinocial."],"ok":1,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Expansão e fronteiras","lesson":"A ocupação colonial avançou além da linha de Tordesilhas, envolvendo expedições, criação de gado e outras atividades.","q":"Qual análise combina território e sociedade?","a":["A expansão ocorreu sem presença ou resistência indígena.","As fronteiras permaneceram imutáveis até 1822.","A pecuária impediu qualquer interiorização.","A expansão ampliou a ocupação colonial e intensificou disputas territoriais."],"ok":3,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Pecuária e engenhos","lesson":"A criação de gado fornecia carne, couro e força de tração e avançou para áreas de pastagem no interior.","q":"Qual vínculo é correto?","a":["A pecuária ajudou no abastecimento e favoreceu caminhos para o interior.","A pecuária dependia exclusivamente da produção de café.","O gado era usado apenas como moeda em cidades holandesas.","A pecuária substituiu imediatamente todos os engenhos."],"ok":0,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Tropeiros e circulação","lesson":"Tropeiros transportavam animais e mercadorias, articulando regiões e criando demandas por pousos e feiras.","q":"Qual consequência é plausível?","a":["Extinção dos caminhos terrestres coloniais.","Isolamento completo entre regiões coloniais.","Formação de rotas comerciais e núcleos de povoamento.","Desaparecimento de feiras e pontos de descanso."],"ok":2,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Drogas do sertão","lesson":"Na região amazônica, produtos como cacau, cravo, canela e outras plantas eram explorados para comércio; essa expressão não significa remédios modernos.","q":"Qual interpretação do termo é correta?","a":["Tratava-se apenas de substâncias proibidas atualmente.","Designava produtos vegetais valorizados no comércio colonial.","Referia-se exclusivamente à produção de açúcar.","Era o nome de uma companhia holandesa."],"ok":1,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Monções","lesson":"Monções eram expedições fluviais que ligavam regiões do interior, especialmente no contexto de circulação rumo a áreas mineradoras.","q":"Qual elemento as diferencia dos tropeiros?","a":["Eram realizadas exclusivamente por franceses.","Eram batalhas navais contra a Holanda.","Transportavam somente pau-brasil no litoral.","Usavam principalmente rios como vias de deslocamento."],"ok":3,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Documento colonial","lesson":"Um relato de invasor pode exaltar conquistas e minimizar violências. Fontes precisam ser lidas com atenção à autoria, data e intenção.","q":"Qual pergunta histórica é mais útil?","a":["Quem produziu o documento, quando e com qual interesse?","Qual frase do documento deve ser aceita sem comparação?","Como eliminar outras fontes para evitar divergências?","Como provar que todos os relatos são neutros?"],"ok":0,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Causalidade histórica","lesson":"A ocupação holandesa não se explica por um único fator: comércio do açúcar, rivalidades políticas e logística atlântica se combinaram.","q":"Qual alternativa oferece a explicação mais completa?","a":["A invasão foi motivada apenas por curiosidade geográfica.","A invasão ocorreu exclusivamente por razões religiosas.","Interesses econômicos e conflitos europeus atuaram conjuntamente.","A invasão resultou apenas de uma disputa entre bandeirantes."],"ok":2,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Comparação das resistências","lesson":"Na história colonial, indígenas resistiram ao apresamento e diferentes grupos resistiram à ocupação holandesa, em contextos distintos.","q":"Qual comparação é correta?","a":["As duas resistências tiveram os mesmos líderes e objetivos.","As resistências ocorreram em contextos diferentes e não devem ser confundidas.","Somente a resistência holandesa envolveu alianças.","Nenhuma resistência envolveu disputas por território."],"ok":1,"level":"Desafio avançado","block":"Capítulo 14"},{"topic":"Síntese do Brasil Colonial","lesson":"Disputas europeias, exploração econômica e expansão territorial ocorreram com participação e resistência de povos indígenas e africanos escravizados.","q":"Qual síntese é mais crítica e completa?","a":["A colonização foi um processo exclusivamente europeu.","As disputas territoriais não alteraram relações sociais.","O interior permaneceu vazio até a mineração.","A colonização combinou interesses econômicos, conflitos e ações de múltiplos grupos."],"ok":3,"level":"Desafio avançado","block":"Capítulo 14"}];const KEY="historia-4b-revisao2";let st;try{st=JSON.parse(localStorage.getItem(KEY))||{p:0,answers:{},sec:0}}catch(e){st={p:0,answers:{},sec:0}}let paused=false;const $=id=>document.getElementById(id);const esc=t=>String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");const save=()=>localStorage.setItem(KEY,JSON.stringify(st));const count=Q.length;function restart(){if(confirm("Reiniciar e apagar respostas e pontuação?")){st={p:0,answers:{},sec:0};save();render()}}function render(){let p=st.p,correct=Object.keys(st.answers).filter(i=>st.answers[i]===Q[i].ok).length;$("count").textContent="Tela "+(p+1)+"/"+(count+2);$("score").textContent="⭐ "+correct+" / "+Object.keys(st.answers).length;$("bar").style.width=(100*(p+1)/(count+2))+"%";$("prev").disabled=p===0;$("next").disabled=p===count+1||(p>0&&p<=count&&st.answers[p-1]===undefined);$("next").textContent=p===count?"Ver diagnóstico →":"Próxima →";if(p===0){$("screen").innerHTML='<span class="eyebrow">História • 4º bimestre • Revisão 2</span><h1>Arquivo Colonial: investigação de alto nível 🔍</h1><p>Agora as alternativas são muito mais próximas. Não basta reconhecer uma palavra: você vai comparar causas, consequências, cronologias e interpretações históricas.</p><div class="guide"><div><b>Fase 1 • Fundamentos</b><p>12 questões para conferir os conceitos sem atalhos.</p></div><div><b>Fase 2 • Interpretação</b><p>14 questões de relações históricas e leitura crítica.</p></div><div><b>Fase 3 • Desafio avançado</b><p>10 questões de síntese e comparação.</p></div><div><b>Regra da missão</b><p>Uma tentativa por questão. As explicações aparecem somente depois da resposta; os erros permanecem no diagnóstico.</p></div></div><p class="source">Base: capítulos 13 e 14 do material enviado. Contextualização histórica complementar identificada nas explicações; páginas dispensadas não são exigidas como conteúdo do livro.</p><button class="primary" onclick="restart()">Reiniciar minha missão</button>';return}if(p===count+1){let by={};Q.forEach((q,i)=>{let k=q.level+" · "+q.block;by[k]??={yes:0,n:0};by[k].n++;if(st.answers[i]===q.ok)by[k].yes++});let misses=Q.map((q,i)=>({q,i})).filter(x=>st.answers[x.i]!==x.q.ok);$("screen").innerHTML='<span class="eyebrow">Relatório final</span><h1>Investigação encerrada</h1><p><b>'+correct+' de '+count+'</b> respostas corretas ('+Math.round(correct/count*100)+'%).</p><h2>Desempenho por fase e capítulo</h2>'+Object.entries(by).map(([k,v])=>'<div class="result-row">'+esc(k)+': <b>'+v.yes+'/'+v.n+'</b></div>').join("")+'<h2>Reforço recomendado</h2>'+(misses.length?misses.map(x=>'<p>• <b>'+esc(x.q.topic)+'</b>: '+esc(x.q.lesson)+'</p>').join(""):'<p>Você acertou todas as questões. Excelente domínio dos assuntos!</p>')+'<button class="primary" onclick="restart()">Refazer do início</button>';return}let i=p-1,q=Q[i],ans=st.answers[i];let cls=q.level==="Desafio avançado"?"hard":q.level==="Interpretação"?"mid":"";$("screen").innerHTML='<span class="eyebrow">'+esc(q.block)+' • Questão '+(i+1)+' de '+count+'</span><p><span class="pill '+cls+'">'+esc(q.level)+'</span></p><h2>'+esc(q.topic)+'</h2><h3>'+esc(q.q)+'</h3><div class="options">'+q.a.map((v,j)=>'<button data-choice="'+j+'" '+(ans!==undefined?'disabled':'')+' class="'+(ans!==undefined?(j===q.ok?'good':j===ans?'bad':''):'')+'">'+String.fromCharCode(65+j)+') '+esc(v)+'</button>').join("")+'</div>'+(ans===undefined?'<p class="source">Modo prova: responda antes de consultar a explicação. Observe as diferenças entre as alternativas.</p>':'<div class="feedback"><strong>'+(ans===q.ok?'✓ Resposta correta.':'✗ Resposta incorreta. Correta: '+String.fromCharCode(65+q.ok)+'.')+'</strong><p>'+esc(q.lesson)+'</p><p><b>Por quê?</b> '+esc(q.a[q.ok])+'</p></div>');document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(st.answers[i]!==undefined)return;st.answers[i]=Number(b.dataset.choice);save();render()})}function move(d){let n=st.p+d;if(n<0||n>count+1)return;if(d>0&&st.p>0&&st.p<=count&&st.answers[st.p-1]===undefined)return;st.p=n;save();render()}$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"Continuar":"Pausar"};setInterval(()=>{if(!paused){st.sec++;if(st.sec%10===0)save()}$("clock").textContent="⏱ "+String(Math.floor(st.sec/60)).padStart(2,"0")+":"+String(st.sec%60).padStart(2,"0")},1000);document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});render();</script></body></html>
